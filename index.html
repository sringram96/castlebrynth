<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Castlebrynth</title>
    <style>
      /* art. 29: three bands — the word, the world, the tray.
         art. 67: the tray is anatomy, not a menu. Its regions are declared
         here, in fixed order, and the shell fills them rather than building
         them: a region that is empty is still in its place, so nothing ever
         moves under the thumb between paints.
         The look proper is still a later task under arts 26–30. What is
         below is the anatomy and the four dice states, which are law. */
      :root {
        --ink: #d8d0c0;
        --dim: #8a8478;
        --sunk: #14120f;
        --raised: #221e19;
        --line: #3a342c;
        --gold: #d9b36a;
        --blood: #a8331f;
        --cold: #7fa8b8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; color: var(--ink); height: 100dvh;
        overflow: hidden; font-family: Georgia, serif; font-size: 15px; line-height: 1.4;
        -webkit-text-size-adjust: 100%; }
      #stage { display: flex; flex-direction: column; height: 100dvh; max-width: 460px;
        margin: 0 auto; }

      /* art. 29: the word — borderless at the top, fades after a beat, tap
         to recall. Tapping it is also how a candle is turned: the beat
         advance is not a tray control (art. 67). */
      #word { flex: 0 0 auto; min-height: 4.6em; padding: 10px 12px; transition: opacity .5s;
        cursor: pointer; }
      #word.faded { opacity: .35; }
      #word .more { color: var(--dim); font-size: .8em; }

      /* art. 29: the world — the frame. art. 68: and it takes taps. */
      #world { position: relative; flex: 1 1 auto; display: flex; align-items: center;
        justify-content: center; min-height: 0; overflow: hidden; }
      canvas { image-rendering: pixelated; display: block; }
      /* The marks sit exactly over the canvas, so a thing is tapped where it
         stands rather than by its name in a list (art. 68). */
      #marks { position: absolute; inset: 0; pointer-events: none; }
      #marks button { position: absolute; background: none; border: 1px solid transparent;
        padding: 0; margin: 0; pointer-events: auto; cursor: pointer; min-width: 40px;
        min-height: 40px; border-radius: 2px; }
      /* art. 6: everything ever clickable is always clickable — so a thing
         that answers shows, faintly, that it will. */
      #marks button.lit { border-color: rgba(217, 179, 106, .22); }
      #marks button.door { border-color: rgba(217, 179, 106, .3); }
      #marks button.door.chosen { border-color: rgba(217, 179, 106, .7); }

      /* art. 57: the horror, its health and its next attack, at the top —
         over the world, because that is where the horror is (art. 30). */
      #crown { position: absolute; left: 0; right: 0; top: 0; padding: 6px 8px;
        display: none; gap: 6px; align-items: center; font-size: .8em;
        background: linear-gradient(#000000cc, #00000000); pointer-events: none; }
      #crown.on { display: flex; }
      #crown > * { pointer-events: auto; }
      #crown .name { color: var(--ink); white-space: nowrap; }
      #crown .bar { flex: 1 1 auto; height: 8px; border: 1px solid var(--line);
        background: var(--sunk); }
      #crown .bar i { display: block; height: 100%; background: var(--blood); }
      #crown .intent { font: inherit; color: var(--ink); background: var(--raised);
        border: 1px solid var(--gold); padding: 4px 8px; min-height: 32px; cursor: pointer;
        white-space: nowrap; }

      /* An overlay over the world: the card, the Book. Never parked
         mid-screen — it is opened by one tap and closed by one (art. 74). */
      #sheet { position: absolute; inset: 0; display: none; flex-direction: column;
        background: #000000ee; padding: 10px 12px; overflow-y: auto; }
      #sheet.on { display: flex; }
      #sheet h1 { font-size: 1em; font-weight: normal; margin: 0 0 8px; color: var(--dim); }
      #sheet .line { display: flex; justify-content: space-between; gap: 10px;
        padding: 3px 0; border-bottom: 1px solid #1c1915; font-size: .9em; }
      #sheet .line.spent { color: #5c574e; text-decoration: line-through; }
      #sheet .line.sealed { color: var(--gold); }
      #sheet .line.open { color: var(--ink); }

      /* art. 67: the tray is anatomy. Four regions, always in these places,
         always in this order, whatever the moment holds. */
      #tray { flex: 0 0 auto; border-top: 1px solid var(--line); padding: 8px 10px 12px;
        display: flex; flex-direction: column; gap: 8px; }
      /* art. 67: the rail. Two rows that are always there and always the
         same — what your body is, and where the thumb can go. */
      #rail { display: flex; flex-direction: column; gap: 6px; }
      #tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
      #tabs button { font: inherit; color: var(--dim); background: none; border: none;
        border-bottom: 2px solid transparent; padding: 5px 12px 6px; letter-spacing: .06em;
        text-transform: lowercase; }
      #tabs button.on { color: var(--ink); border-bottom-color: var(--gold); }
      /* arts 31, 85: a socket, and it says so. It is not a button that fails
         — it is a place where a thing is not. */
      #tabs button[disabled] { color: #4a453d; border-bottom-color: transparent; opacity: .55; }
      #panels { padding-top: 8px; }
      .panel { display: none; }
      .panel.on { display: block; }
      #vitals { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
        min-height: 24px; font-size: .85em; color: var(--dim); }
      #vitals b { font-weight: normal; color: var(--ink); }
      #vitals .glyph { margin-left: auto; font: inherit; color: var(--ink);
        background: var(--raised); border: 1px solid var(--line); width: 34px; height: 30px;
        cursor: pointer; line-height: 1; }
      #pouch.on, #fight.on { display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px;
        align-items: center; }
      #acts.on { display: flex; flex-wrap: wrap; gap: 6px; min-height: 42px; align-items: center; }
      /* art. 30: no battle screen — the world band is still the room. What
         changes mode is the tray, so the fight panel gets its own ground:
         darker, ruled off, and lit along the top edge. */
      #fight { background: #14120f; margin: -8px -10px -12px; padding: 8px 10px 12px;
        border-top: 1px solid var(--gold); box-shadow: inset 0 14px 22px -18px #000; }
      #fight .totals { flex: 1 0 100%; display: flex; flex-wrap: wrap; gap: 4px 12px;
        color: var(--dim); font-size: .82em; align-items: center; margin-bottom: 2px; }
      #fight .totals b { font-weight: normal; color: var(--ink); }
      #fight .totals .glyph { margin-left: auto; font: inherit; color: var(--ink);
        background: none; border: 1px solid var(--line); border-radius: 3px;
        padding: 1px 7px; }
      /* The line a panel says when it has something to explain (art. 69). */
      .panel .aside { flex: 1 0 100%; color: var(--dim); font-size: .82em; margin-top: 2px; }
      .panel .rule { flex: 1 0 100%; height: 1px; background: var(--line); margin: 2px 0; }

      button { font: inherit; background: var(--raised); color: var(--ink);
        border: 1px solid #55504a; padding: 9px 12px; min-height: 42px; cursor: pointer; }
      button:disabled { opacity: .35; cursor: default; }
      #acts button { min-width: 76px; }

      /* art. 72: idle, kept, selected and claimed are unmistakably distinct —
         not four border colours, which the playtest could not read. The face
         inverts when selected, wears a tab when kept, and is ringed and sunk
         when claimed. Unused dice dim at resolve. */
      .slot { width: 42px; height: 42px; padding: 0; position: relative; background: var(--sunk);
        border: 1px solid var(--line); }
      .slot.empty { border-style: dashed; opacity: .5; }
      .slot .pips { position: absolute; inset: 5px; display: grid;
        grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
      .slot .pips span { display: flex; align-items: center; justify-content: center; }
      .slot .pips i { display: block; width: 7px; height: 7px; border-radius: 50%;
        background: var(--ink); }
      .slot.die { background: #262119; }
      /* A die still in the pouch has not been thrown: a bone, and no face. */
      .slot.die.rest::after { content: ''; position: absolute; inset: 10px;
        border: 1px solid #6b6154; }
      .slot.kept { background: #2a3238; border-color: var(--cold); }
      .slot.kept::after { content: ''; position: absolute; top: -1px; left: -1px; right: -1px;
        height: 5px; background: var(--cold); }
      .slot.sel { background: var(--ink); border-color: var(--gold); border-width: 2px; }
      .slot.sel .pips i { background: #14120f; }
      .slot.claimed { background: #14120f; border-color: var(--gold); opacity: .8; }
      .slot.claimed::after { content: ''; position: absolute; inset: 3px;
        border: 1px solid var(--gold); border-radius: 50%; }
      .slot.claimed.sel::after { border-color: #14120f; }
      .slot.unused { opacity: .4; }
      /* art. 60: a spare is yours and not in your hand. It reads as a die
         that has been set down — same body, no lit face, and set apart from
         the hand by a rule down the left of it. */
      .slot.spare { background: #1b1813; border-color: #3a332a; opacity: .72;
        margin-left: 10px; box-shadow: inset 3px 0 0 -1px var(--gold); }
      .slot.spare .pips i { background: #6d6252; }
      .slot.spare.sel { opacity: 1; }
      .slot.carried { background: #2a2418; border-color: var(--gold); font-size: .7em;
        color: var(--gold); }
    </style>
  </head>
  <body>
    <!-- art. 29: three bands — the word, the world, the tray. -->
    <div id="stage">
      <div id="word"></div>
      <main id="world">
        <canvas id="view"></canvas>
        <div id="marks"></div>
        <div id="crown"></div>
        <div id="sheet"></div>
      </main>
      <!--
        art. 67 (amended): the tray is a persistent rail and a panel area.
        The rail never changes; the panels swap under it. The map tab is a
        socket with nothing behind it (arts 31, 85) — there is no #map.
      -->
      <div id="tray">
        <div id="rail">
          <div id="vitals"></div>
          <div id="tabs"></div>
        </div>
        <div id="panels">
          <div id="acts" class="panel"></div>
          <div id="pouch" class="panel"></div>
          <div id="fight" class="panel"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
