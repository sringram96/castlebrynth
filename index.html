<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Castlebrynth</title>
    <style>
      /* art. 29: three bands — the word, the world, the tray.
         art. 67: the tray is anatomy, not a menu. Its regions are declared
         here, in fixed order, and the shell fills them rather than building
         them: a region that is empty is still in its place, so nothing ever
         moves under the thumb between paints.
         The look proper is still a later task under arts 26–30. What is
         below is the anatomy and the four dice states, which are law. */
      :root {
        --ink: #d8d0c0;
        --dim: #8a8478;
        --sunk: #14120f;
        --raised: #221e19;
        --line: #3a342c;
        --gold: #d9b36a;
        --blood: #a8331f;
        --cold: #7fa8b8;

        /* arts 126, 128: **the tray is a made object.**
           The reference (`reference/visual/canonical-screen.png`) puts the
           interface *in* the world: a carved reliquary of bone and oxidised
           iron sitting at the bottom of the lens, with the dice recessed into
           it. What is below is that material language as variables, so the
           stylesheet says *bone*, *iron*, *carved* and *sunk* rather than
           repeating six hex values down the file.
           It is presentation, so art. 116's first sentence applies: none of
           it changes what is true, and none of it is a setting. */
        --bone: #b9b09a;
        --bone-dim: #8d8571;
        --bone-deep: #5d5748;
        --iron: #2a2823;
        --iron-lit: #423e35;
        --iron-deep: #171612;
        --carve: #0a0908;
        --rust: #6b4326;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; color: var(--ink); height: 100dvh;
        overflow: hidden; font-family: Georgia, serif; font-size: 15px; line-height: 1.4;
        -webkit-text-size-adjust: 100%; }
      #stage { display: flex; flex-direction: column; height: 100dvh; max-width: 460px;
        margin: 0 auto; }

      /* art. 29: the word — borderless at the top, fades after a beat, tap
         to recall. Tapping it is also how a candle is turned: the beat
         advance is not a tray control (art. 67). */
      #word { flex: 0 0 auto; min-height: 4.6em; padding: 10px 12px; transition: opacity .5s;
        cursor: pointer; }
      #word.faded { opacity: .35; }
      #word .more { color: var(--dim); font-size: .8em; }

      /* art. 29: the world — the frame. art. 68: and it takes taps. */
      #world { position: relative; flex: 1 1 auto; display: flex; align-items: center;
        justify-content: center; min-height: 0; overflow: hidden; background: #000; }
      canvas { image-rendering: pixelated; display: block; }
      /* The marks sit exactly over the canvas, so a thing is tapped where it
         stands rather than by its name in a list (art. 68). */
      #marks { position: absolute; inset: 0; pointer-events: none; }
      #marks button { position: absolute; background: none; border: 1px solid transparent;
        padding: 0; margin: 0; pointer-events: auto; cursor: pointer; min-width: 40px;
        min-height: 40px; border-radius: 2px; }
      /* art. 6: everything ever clickable is always clickable — so a thing
         that answers shows, faintly, that it will. */
      #marks button.lit { border-color: rgba(217, 179, 106, .22); }
      /* art. 97: a door is drawn as a door — framed, recessed, standing on
         the floor — so it needs no box around it to say so. The outlined
         rectangle the playtest read as a chest was this border. Only the
         door the thumb has picked wears one, and that is a pick and not a
         doorway. */
      #marks button.door { border-color: transparent; }
      #marks button.door.chosen { border-color: rgba(217, 179, 106, .7); }

      /* art. 57: the horror, its health and its next attack, at the top —
         over the world, because that is where the horror is (art. 30). */
      #crown { position: absolute; left: 0; right: 0; top: 0; padding: 6px 8px;
        display: none; gap: 6px; align-items: center; font-size: .8em;
        background: linear-gradient(#000000cc, #00000000); pointer-events: none; }
      #crown.on { display: flex; }
      #crown > * { pointer-events: auto; }
      #crown .name { color: var(--ink); white-space: nowrap; }
      #crown .bar { flex: 1 1 auto; height: 8px; border: 1px solid var(--line);
        background: var(--sunk); }
      #crown .bar i { display: block; height: 100%; background: var(--blood); }
      #crown .intent { font: inherit; color: var(--ink); background: var(--raised);
        border: 1px solid var(--gold); padding: 4px 8px; min-height: 32px; cursor: pointer;
        white-space: nowrap; }

      /* An overlay over the world: the card, the Book. Never parked
         mid-screen — it is opened by one tap and closed by one (art. 74). */
      #sheet { position: absolute; inset: 0; display: none; flex-direction: column;
        background: #000000ee; padding: 10px 12px; overflow-y: auto; }
      #sheet.on { display: flex; }
      #sheet h1 { font-size: 1em; font-weight: normal; margin: 0 0 8px; color: var(--dim); }
      /* A Book line carries an ending's sentence now, so it wraps rather than
         squeezing the numbers off the edge of a phone. */
      #sheet .line { display: flex; justify-content: space-between; gap: 10px;
        flex-wrap: wrap; padding: 3px 0; border-bottom: 1px solid #1c1915; font-size: .9em; }
      /* The numbers beside an ending, on every line alike (art. 11). */
      #sheet .line .tag { color: var(--dim); white-space: nowrap; }
      #sheet .line.spent { color: #5c574e; text-decoration: line-through; }
      #sheet .line.sealed { color: var(--gold); }
      #sheet .line.open { color: var(--ink); }
      /* card 90: a line the pouch has moved says so on the card, so a level
         is readable before a claim of that line ever lands (art. 53). */
      #sheet .line.levelled { font-weight: 600; }
      #sheet .line.levelled span:last-child { color: var(--gold); }

      /* art. 67: the tray is anatomy. Four regions, always in these places,
         always in this order, whatever the moment holds. */
      /* art. 126: the tray is carved, not drawn. Three things do the work and
         nothing else is needed: a lit top edge so it reads as a lip standing
         proud of the world above it, a dark body with a vertical grain, and
         an inner shadow under the lip so the panel sits *inside* the frame
         rather than on top of the page. The room's own darkness runs into it,
         which is what stops the seam reading as a fold in a web page. */
      #tray { flex: 0 0 auto; padding: 8px 10px 12px;
        display: flex; flex-direction: column; gap: 8px;
        background:
          linear-gradient(#00000000 0, #000000aa 6px, #00000000 7px),
          linear-gradient(180deg, var(--iron-lit) 0, var(--iron) 3px, #1e1c18 34%, #141310 100%);
        border-top: 2px solid var(--bone-deep);
        box-shadow: inset 0 3px 10px -4px #000, inset 0 -30px 40px -34px #000;
      }
      /* art. 67: the rail. Two rows that are always there and always the
         same — what your body is, and where the thumb can go. */
      #rail { display: flex; flex-direction: column; gap: 6px; }
      #tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
      #tabs button { font: inherit; color: var(--bone-deep); background: none; border: none;
        border-bottom: 2px solid transparent; padding: 5px 12px 6px; letter-spacing: .06em;
        text-transform: lowercase; text-shadow: 0 1px 0 #000; }
      /* art. 90: a tab is a label and names a place. The one you are standing
         in is cut brighter and lit along its foot; the rest are cut shallow. */
      #tabs button.on { color: var(--bone); border-bottom-color: var(--gold);
        text-shadow: 0 0 6px #d9b36a44, 0 1px 0 #000; }
      /* arts 31, 85: a socket, and it says so. It is not a button that fails
         — it is a place where a thing is not. */
      #tabs button[disabled] { color: #4a453d; border-bottom-color: transparent; opacity: .55; }
      #panels { padding-top: 8px; }
      .panel { display: none; }
      .panel.on { display: block; }
      /* art. 67: the rail never changes, and art. 126 makes it a carved band
         across the top of the reliquary — the body on the left, the ways
         through on the right, cut into the same bone. */
      #vitals { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
        min-height: 26px; font-size: .85em; color: var(--bone-dim);
        padding: 3px 8px; border-radius: 2px;
        background: linear-gradient(180deg, #1d1b16 0, #131210 100%);
        box-shadow: inset 0 1px 0 #494236, inset 0 -1px 0 #000, 0 1px 0 #322c24; }
      #vitals b { font-weight: normal; color: var(--bone); }
      #vitals .glyph { margin-left: auto; font: inherit; color: var(--ink);
        background: var(--raised); border: 1px solid var(--line); width: 34px; height: 30px;
        cursor: pointer; line-height: 1; }
      #pouch.on, #fight.on { display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px;
        align-items: center; }
      #acts.on { display: flex; flex-wrap: wrap; gap: 6px; min-height: 42px; align-items: center; }
      /* art. 30: no battle screen — the world band is still the room. What
         changes mode is the tray, so the fight panel gets its own ground:
         darker, ruled off, and lit along the top edge. */
      /* art. 126: the duel's ground is a shelf cut into the reliquary — sunk
         below the rail, lit along its lip, with the room's darkness pooling
         at the bottom of it. */
      #fight { margin: -8px -10px -12px; padding: 10px 10px 12px;
        background: linear-gradient(180deg, #100f0c 0, #17150f 45%, #0d0c09 100%);
        border-top: 1px solid var(--bone-deep);
        box-shadow: inset 0 1px 0 #4a4235, inset 0 16px 24px -18px #000; }
      #fight .totals { flex: 1 0 100%; display: flex; flex-wrap: wrap; gap: 4px 12px;
        color: var(--dim); font-size: .82em; align-items: center; margin-bottom: 2px; }
      #fight .totals b { font-weight: normal; color: var(--ink); }
      #fight .totals .glyph { margin-left: auto; font: inherit; color: var(--ink);
        background: none; border: 1px solid var(--line); border-radius: 3px;
        padding: 1px 7px; }
      /* The line a panel says when it has something to explain (art. 69). */
      .panel .aside { flex: 1 0 100%; color: var(--dim); font-size: .82em; margin-top: 2px; }
      .panel .rule { flex: 1 0 100%; height: 1px; background: var(--line); margin: 2px 0; }

      /* art. 116: settings. A setting names a thing and shows its state, so
         it is a full-width row with the state at the end of it rather than a
         control among controls (art. 90 governs it, not art. 66). */
      .panel .setting { flex: 1 0 100%; display: flex; justify-content: space-between;
        align-items: center; text-align: left; }
      .panel .setting b { font-weight: normal; color: var(--dim); }
      .panel .setting.on b { color: var(--gold); }
      /* The vault, as text you can carry off. Read-through, not decoration:
         it has to be selectable and it has to hold a whole snapshot. */
      .panel .vault { flex: 1 0 100%; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
        color: var(--dim); background: var(--sunk); border: 1px solid var(--line);
        padding: 6px 8px; resize: vertical; width: 100%; }
      .panel .strip { flex: 1 0 100%; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

      /* art. 119 §3: **the shake.** Two game pixels for about three frames,
         and the only time the room itself moves — the frame is the player's
         body, and spending that gesture anywhere else spends it for nothing.
         `--shake` is set by the shell from the frame's own scale, because
         art. 22 says nothing is fixed in device pixels. */
      #stage.shaken { transform: translate(var(--shake, 2px),
        calc(var(--shake, 2px) * -0.6)); }

      /* art. 119 §3: the crown falls as the blow lands, and the bar it falls
         on says so for the beat the blow stands. */
      #crown .bar.struck { border-color: var(--ink); }
      #crown .bar.struck i { background: #e0a08c; }
      /* The tell, one turn early. It marks itself — it never says what is
         coming, which is art. 42's line and this does not cross it. */
      #crown .intent.telling { border-color: var(--blood); color: #e8c9a0;
        box-shadow: 0 0 0 1px var(--blood) inset; }

      /* art. 65, art. 119 §3: each effect gets a signature, because art. 65
         attacks the plan and the plan is on screen. */
      /* seal — it shuts the pair-shaped lines, and the lines live behind
         the glyph (art. 74), so the glyph is where the seal can be seen. */
      #fight .totals .glyph.sealed { border-color: var(--gold); color: var(--gold); }
      /* corrode — the armour flakes off the vitals as the blow eats it. */
      #vitals .flaking b, #vitals .flaking { color: var(--blood); }
      /* bleed — a mark that ticks, on the readout the plan was made against. */
      #fight .totals .ticking b { color: var(--blood); }
      /* bind — the die drags out of the tray on the beat it is taken. */
      .slot.bound.dragged { transform: translate(4px, 3px); opacity: .35; }
      /* curse — the cursed value goes grey, and stays grey for the turn it
         is cursed for (art. 70: pixels prove). */
      .slot.cursed { border-style: dashed; }
      .slot.cursed .pips i { background: #55504a; }

      /* art. 116: with the world held still, nothing eases into anything.
         The settled state is unchanged — art. 29's word band is still faded
         after its beat — so what goes is the travel, not the truth. */
      .still, .still * { transition: none !important; animation: none !important; }

      button { font: inherit; background: var(--raised); color: var(--ink);
        border: 1px solid #55504a; padding: 9px 12px; min-height: 42px; cursor: pointer; }
      button:disabled { opacity: .35; cursor: default; }
      #acts button { min-width: 76px; }

      /* art. 72: idle, kept, selected and claimed are unmistakably distinct —
         not four border colours, which the playtest could not read. The face
         inverts when selected, wears a tab when kept, and is ringed and sunk
         when claimed. Unused dice dim at resolve. */
      /* card 94, amended after a hand: the dice were hard to read at 42px on a
         phone. 48 with a 40px face is a quarter larger and still fits six on
         one row at 390px — the verbs wrap to their own line beneath, which
         reads better than sharing a row with the hand anyway. */
      /* art. 128: **the hand is a collection, and its row is computed.**
         There are no six slots and no `nth-child` — there is one row, whose
         die size, gap and wrap point arrive from `src/shell/tray.ts` as
         custom properties. `--per-row` is what makes a two-row hand break
         where the layout decided rather than wherever the box runs out, so
         nine dice are five and four instead of eight and one. */
      .hand { display: flex; flex-wrap: wrap; justify-content: center;
        gap: var(--gap, 6px); flex: 1 0 100%; margin: 0 auto;
        max-width: calc(var(--per-row, 6) * var(--die, 48px)
                      + (var(--per-row, 6) - 1) * var(--gap, 6px)); }
      .hand .slot { width: var(--die, 48px); height: var(--die, 48px); }

      .slot { width: 48px; height: 48px; padding: 0; position: relative; background: var(--sunk);
        border: 1px solid var(--line); display: flex; align-items: center;
        justify-content: center; }
      .slot.empty { border-style: dashed; opacity: .5; }
      /* card 94: the face is an authored drawing now, painted to a canvas from
         indices into its own material's ramp (art. 100). The stylesheet does
         not know what a pip is and must not: a colour here would be a colour
         off the ramp, which is the one thing art. 100 forbids. */
      .slot .mark { display: block; image-rendering: pixelated; }
      /* art. 126: a die is a thing sitting in a tray, not a browser control.
         The well it sits in is carved (dark, sunk, hard-edged); the die is
         warm bone standing proud of it. The reference gets this right and it
         is most of why its interface reads as part of the image. */
      .slot.die { background: linear-gradient(180deg, #2f2920 0, #241f18 60%, #1b1712 100%);
        border-color: #4a4235; border-radius: 3px;
        box-shadow: inset 0 1px 0 #5c5344, inset 0 -2px 3px -1px #000, 0 1px 2px #0009; }
      /* art. 119, card 75: a die still in the air. It is not a fifth state
         under art. 72 — those four are what a die *is*, and this is a die
         that has not finished arriving — so it says so by being unsettled
         rather than by taking a colour of its own. */
      .slot.die.rolling { border-color: #4c463c; opacity: .8; }
      .slot.kept { background: #2a3238; border-color: var(--cold); }
      .slot.kept::after { content: ''; position: absolute; top: -1px; left: -1px; right: -1px;
        height: 5px; background: var(--cold); }
      /* card 94: selection stopped inverting the slot. It could invert while
         a die was a pip grid the stylesheet drew — it could recolour the pips
         to match. A die is an authored drawing now and its colours are its
         material's (art. 100), so a white ground under it washes the bone out
         instead of reversing it. The gold surround is the demo's own mark and
         art. 72's four states stay unmistakably distinct: a warm ring here, a
         cold tab kept, a sunk circle claimed, nothing idle. */
      .slot.sel { background: #2a2113; border-color: var(--gold); border-width: 2px;
        box-shadow: 0 0 0 1px rgba(217,179,106,.45); }
      .slot.claimed { background: #14120f; border-color: var(--gold); opacity: .8; }
      .slot.claimed::after { content: ''; position: absolute; inset: 3px;
        border: 1px solid var(--gold); border-radius: 50%; pointer-events: none; }
      .slot.claimed.sel::after { border-color: #14120f; }
      .slot.unused { opacity: .4; }
      /* art. 119 §2: a claimed die lifts, alone, brightening — and stays
         lifted, because the total is still climbing off it. It sits a pixel
         proud of the row, which is the only thing in the tray that does. The
         brightening is the drawing's own ramp, relit (art. 115), not a rule
         here: one drawing, two lights. */
      .slot.lifted { background: #2f2717; border-color: var(--gold);
        transform: translateY(-2px); }
      /* card 94: the number pops off the thing that made it and is gone. The
         caption under the thing is the standing explanation, so this only ever
         carries the amount — v1 of the wave threw numbers that left their
         source and v2 wrote a receipt; both are in DESIGN.md, and neither
         returns. */
      .pop { position: absolute; left: 50%; top: -4px; transform: translate(-50%, 0);
        white-space: nowrap; font: 600 15px Georgia, serif; pointer-events: none;
        opacity: 0; z-index: 5; text-shadow: 0 1px 3px rgba(0,0,0,.9);
        animation: pop .62s ease-out forwards; }
      @keyframes pop {
        0%   { opacity: 0; transform: translate(-50%, 4px) scale(.8); }
        22%  { opacity: 1; transform: translate(-50%, -8px) scale(1.15); }
        60%  { opacity: 1; transform: translate(-50%, -16px) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -30px) scale(1); }
      }
      .slot.carried { background: #2a2418; border-color: var(--gold); font-size: .7em;
        color: var(--gold); }
      /* art. 65: a bound die is not in the turn at all — it never lands. It
         is drawn anyway, and drawn shut: hand size is the thing the effect
         attacks, so the hole it leaves has to be the visible part of it. The
         bar across it is the one mark in the tray that means "not yours this
         turn", and a tap says who took it (art. 69). */
      .slot.bound { background: #191517; border-color: #4a2f33; opacity: .62; }
      .slot.bound::after { content: ''; position: absolute; left: -1px; right: -1px;
        top: 50%; height: 3px; margin-top: -1px; background: #7a3b40;
        pointer-events: none; }
      /* card 93/94: a rolling good sits beside the hand it is not part of, and
         it is a different **object** now rather than the same box in another
         border colour — cold bevelled iron with a glyph on it, against warm
         rounded pipped bone. That is what the playtest could not do: tell the
         six from the carried things. The bar is that the two rows read apart
         with the screen upside down, so the separator can be one dashed
         hairline and no heading (art. 100 does the work, not a label).
         It renders only if carried: there is no empty state, because carrying
         none is the normal state of the game. */
      .slot.trinket { width: auto; min-width: 56px; height: auto; padding: 3px 6px 4px;
        flex-direction: column; gap: 2px; font-size: .62em; color: var(--dim);
        background: #14171d; border-color: #2f3846; }
      /* card 94: **the caption stands at all times**, so what a carried thing
         is holding is readable while the line is still being chosen. It is the
         standing explanation; the pop is only ever the amount. */
      .slot.trinket .cap { display: block; text-align: center; line-height: 1.2; }
      .slot.trinket .cap b { display: block; font-weight: normal; }
      .slot.trinket .cap i { display: block; font-style: normal; color: #4b463f; }
      /* A face that did nothing: the metal goes dull and nothing is claimed. */
      .slot.trinket.idle { opacity: .72; }
      .slot.trinket.rolled { border-color: #45566b; }
      /* art. 119: and the beat it lands on is the one moment it moves. */
      .slot.trinket.landing { background: #1d2530; border-color: var(--gold);
        transform: translateY(-2px); }

      /* card 94: **one readout, two boxes — sum × line.** It is live before
         Attack, it is the only running number in the fight, and through a
         cascade it reads art. 119's beats: the sum ticks as the bones lift,
         the multiplier lights when the line names itself, and the two collapse
         into the blow. */
      #fight .score { flex: 1 0 100%; display: flex; align-items: center;
        justify-content: center; gap: 10px; padding: 4px 0 7px; }
      #fight .score .box { min-width: 58px; padding: 2px 10px; border: 1px solid #3a322a;
        background: #141110; text-align: center; font-variant-numeric: tabular-nums;
        font-size: 1.4rem; color: var(--gold);
        transition: transform .13s ease-out, color .13s, border-color .13s; }
      #fight .score .box.pulse { transform: scale(1.13); color: #f0c874;
        border-color: var(--gold); }
      #fight .score .box.dead { color: #4b463f; border-color: #282320; }
      #fight .score .op { font-size: 1rem; color: var(--dim); }
      #fight .score .op.dead { color: #2f2b27; }
      #fight .score .cap2 { display: block; margin-top: 2px; text-align: center;
        font-size: .58rem; letter-spacing: .14em; color: #55504a; }

      /* card 94, art. 54: **a thing shows its faces.** A die at rest was a
         hollow box and a trinket was a name, so the pouch held seven identical
         boxes and the screen whose whole job is telling dice apart drew every
         one of them as a 1. A thing not on the table is its name and its whole
         face set, in the order a roll indexes them. */
      .reading { flex: 1 0 100%; display: flex; align-items: center; gap: 8px;
        padding: 3px 6px; background: none; border: 1px solid transparent;
        min-height: 34px; text-align: left; }
      .reading .name { flex: 0 0 auto; min-width: 5.4em; font-size: .74em; color: var(--dim); }
      .reading .faces { display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-start; }
      .reading .fw { display: flex; flex-direction: column; align-items: center; gap: 1px; }
      .reading .fw .mark { display: block; image-rendering: pixelated; }
      .reading .fl { font-size: .52em; line-height: 1.1; text-align: center;
        max-width: 4.2em; color: #55504a; }
      /* art. 60: a spare is yours and not in your hand — same body, dimmer,
         and set apart by the rule above it rather than by a colour. */
      .reading.spare { opacity: .66; }
      .reading.sel { border-color: var(--gold); background: #1c1710; }
      .reading.sel .name { color: var(--ink); }
      /* art. 124: identical spares stack, so a row may stand for more than
         one of itself. It sits at the end of the row, out of the way of the
         faces, because it is a fact about the stack and not about the die. */
      .reading .count { margin-left: auto; flex: 0 0 auto; font-size: .74em;
        color: var(--dim); }
      /* card 94: once the materials differ, a dashed hairline is the whole
         separator the tray needs. No heading, no label. */
      .panel .rule.iron { background: none; height: 0; border-top: 1px dashed #2f3846; }
    </style>
  </head>
  <body>
    <!-- art. 29: three bands — the word, the world, the tray. -->
    <div id="stage">
      <div id="word"></div>
      <main id="world">
        <canvas id="view"></canvas>
        <div id="marks"></div>
        <div id="crown"></div>
        <div id="sheet"></div>
      </main>
