name: law

on:
  push:
    branches: [main]
  pull_request:

jobs:
  law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: law
        run: npm run law

      # Reporting, not a gate. `progress` exits non-zero until every card is
      # green, which is the normal state for most of a phase — letting it fail
      # the job would make `law` red for the whole build-out.
      - name: progress
        if: always()
        continue-on-error: true
        run: npm run progress
