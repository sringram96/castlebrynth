name: scope
# Pull-request only: a push to main has no PR body to check.
# `npm run law` stays in ci.yml — a red law already fails the PR there.
# `edited` matters: the body IS the input, so correcting it must re-run
# the guard. Without it a fixed PR stays red until an unrelated push.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  scope-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The guard's own fixtures. `npm run law` runs `vitest run src`,
      # so this file is the only thing that runs them.
      - name: fixtures — the guard fails an undeclared file, passes a conforming PR
        run: npx vitest run scripts
      # The changed-file list comes from the API, not from git: the
      # checkout above is shallow by default and would need fetch-depth
      # 0 plus a base-sha dance to be trustworthy. The API returns
      # exactly the files the reviewer sees under "Files changed".
      # PR_BODY is untrusted contributor text — it is passed through the
      # environment and never interpolated into this shell.
      - name: scope guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Body from the API, not github.event: the event payload is a
          # snapshot from when the run was queued, so a re-run of a
          # corrected PR would keep judging the stale text.
          PR_BODY="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""')"
          export PR_BODY
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' \
            | node scripts/scope-guard.mjs --body-env PR_BODY
