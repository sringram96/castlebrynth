# The URL is the whole install, so shipping is publishing a directory.
# Build, unit tests and the browser journeys gate every push and every pull
# request; main also deploys to GitHub Pages.
name: build

on:
  push:
    branches: [main]
  pull_request:
  # So a Pages deploy can be re-run by hand without an empty commit.
  workflow_dispatch:

# One deploy at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc --noEmit under strict, then vite build. A type error is a
      # failed build here, not a surprise at deploy time.
      - run: npm run build
      - run: npm test
      # The tests that decide whether the game works. A green unit suite can
      # sit on top of an overlay that eats every tap, which is how the
      # pre-reset build shipped a bottom row nobody could press.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: github pages
    # Only main publishes. A pull request gets the tests and nothing else.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on the first time this runs, so nobody has to go
          # find the setting. Needs the pages:write above; harmless after.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Ten minutes is a **hard ceiling** in this action, not a default:
      # passing anything larger logs "timeout value is greater than the
      # allowed maximum - timeout set to the maximum of 600000
      # milliseconds" and clamps it. Raising it is not an option, so do not
      # try — that was tried on 2026-08-06 and did nothing but add a warning
      # to every run.
      #
      # What that means when Pages is slow: the step polls for ten minutes,
      # gives up, and *cancels* the deployment — and the deployment lands
      # anyway. On 2026-08-06 three runs went red this way while the site
      # published correctly each time.
      #
      # **So this step is no longer the verdict.** It still does the work —
      # it is what asks Pages to publish the artifact — and its own poller
      # is allowed to give up without failing the run. What decides whether
      # the run is green is the step after it (standing rule 1).
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # **Green means served.** `npm run build` writes the commit into
      # dist/version.txt, so this asks the live site what it is holding and
      # believes nothing else. It polls the *known* URL rather than the
      # deployment step's output, because a step that was cancelled may not
      # emit one — the whole reason this step exists is that the step above
      # can fail while the publish succeeds.
      #
      # A project site lives at https://<owner>.github.io/<repo>/, which is
      # derivable and does not need a secret or a hardcoded host. Cache is
      # busted with a query string so a CDN copy cannot answer for the
      # origin.
      - name: verify the site is serving this commit
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -u
          for attempt in $(seq 1 40); do
            served=$(curl -fsS --max-time 20 "$SITE/version.txt?t=$attempt" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$served" = "$GITHUB_SHA" ]; then
              echo "served $served — this commit is live at $SITE"
              exit 0
            fi
            echo "attempt $attempt/40: serving '${served:-<nothing>}', want '$GITHUB_SHA'"
            sleep 15
          done
          echo "::error::$SITE is not serving $GITHUB_SHA after ten minutes."
          exit 1
