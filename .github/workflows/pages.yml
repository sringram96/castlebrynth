# The URL is the whole install (DESIGN.md), so shipping is publishing a
# directory. Tests gate every push and every pull request; main also
# deploys to GitHub Pages.
name: build

on:
  push:
    branches: [main]
  pull_request:
  # So a Pages deploy can be re-run by hand without an empty commit.
  workflow_dispatch:

# One deploy at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc --noEmit under strict, then vite build. A type error is a
      # failed build here, not a surprise at deploy time.
      - run: npm run build
      - run: npm test

  deploy:
    name: github pages
    # Only main publishes. A pull request gets the tests and nothing else.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on the first time this runs, so nobody has to go
          # find the setting. Needs the pages:write above; harmless after.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Ten minutes is a **hard ceiling** in this action, not a default:
      # passing anything larger logs "timeout value is greater than the
      # allowed maximum - timeout set to the maximum of 600000
      # milliseconds" and clamps it. Raising it is not an option, so do not
      # try — that was tried on 2026-08-06 and did nothing but add a warning
      # to every run.
      #
      # What that means when Pages is slow: the step polls for ten minutes,
      # gives up, and *cancels* the deployment — and the deployment lands
      # anyway. On 2026-08-06 three runs went red this way while the site
      # published correctly each time. **A red deploy step is therefore not
      # proof that the publish failed.** Check the served asset hash before
      # believing it.
      - id: deployment
        uses: actions/deploy-pages@v4
