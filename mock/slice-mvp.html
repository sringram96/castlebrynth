<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CASTLEBRYNTH — slice: five rooms, two levels</title>
<style>
  :root{ --bg:#191d20; --panel:#101417; --edge:#2e363b; --text:#e6e1d6; --dim:#96917f;
    --sel:#9db8a2; --bad:#c07a63; --key:#c8b06a; --open:96%; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #app{height:100dvh;display:flex;flex-direction:column;}
  #narr{padding:12px 16px;font-family:Georgia,serif;font-style:italic;font-size:15.5px;
    line-height:1.45;min-height:3.2em;transition:opacity .22s;}
  #narr.swap{opacity:0;}
  #stage{position:relative;flex:1;min-height:0;}
  .obj{position:absolute;border:1px solid var(--edge);border-radius:8px;padding:6px;
    font-size:12px;letter-spacing:.03em;cursor:pointer;color:var(--text);
    display:flex;align-items:flex-end;justify-content:center;min-width:54px;min-height:50px;
    outline:1px dashed rgba(230,225,214,.28);outline-offset:2px;text-transform:lowercase;}
  .obj.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel);}
  .obj.enemy{border-color:#5c3f35;}
  .obj.exit{border-style:dashed;color:var(--dim);}
  #vig{position:absolute;inset:0;pointer-events:none;transition:background .8s;
    background:radial-gradient(ellipse at 50% 45%, transparent var(--open), rgba(0,0,0,.92) 100%);}
  #vig.hurt{animation:hurt .45s;}
  @keyframes hurt{0%{box-shadow:inset 0 0 70px 20px rgba(192,122,99,.5);}100%{box-shadow:none;}}
  #dice{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:none;
    background:rgba(10,13,15,.95);border:1px solid var(--edge);border-radius:8px;
    padding:7px 12px;font-size:13.5px;white-space:nowrap;z-index:4;}
  #dice .d{font-size:19px;vertical-align:-2px;} #dice.show{display:block;}
  #wardbtn{margin-left:10px;background:#243029;border:1px solid var(--sel);color:var(--text);
    border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;display:none;}
  #qtebox{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(8,10,12,.72);z-index:6;}
  #qtebox.show{display:flex;}
  #qtein{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
    padding:16px;min-width:72%;text-align:center;}
  #qtein p{margin:0 0 12px;font-family:Georgia,serif;font-style:italic;}
  #qtebar{height:4px;background:#2b3338;border-radius:2px;margin-bottom:12px;overflow:hidden;}
  #qtefill{height:100%;width:100%;background:var(--bad);}
  #end{position:absolute;inset:0;background:rgba(5,8,10,.96);display:none;z-index:9;
    align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:28px;}
  #end.show{display:flex;}
  #end p{font-family:Georgia,serif;font-style:italic;font-size:18px;line-height:1.6;max-width:32ch;}
  #end small{color:var(--dim);}
  /* panel */
  #panel{background:var(--panel);border-top:1px solid var(--edge);height:230px;flex:none;
    display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
  #strip{display:flex;gap:12px;padding:8px 12px;font-size:12px;color:var(--dim);
    border-bottom:1px solid #1a2024;flex-wrap:wrap;}
  #strip b{color:var(--text);font-weight:600;}
  #strip .loc{margin-left:auto;text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;}
  #pager{display:flex;align-items:center;gap:8px;padding:7px 10px 0;}
  .pgbtn{background:none;border:1px solid var(--edge);color:var(--dim);border-radius:7px;
    padding:7px 13px;cursor:pointer;font-size:14px;}
  #ptitle{flex:1;text-align:center;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text);}
  #body{flex:1;overflow:auto;padding:10px 14px 12px;}
  #selname{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);}
  #cap{font-size:12.5px;color:var(--dim);margin:3px 0 8px;min-height:15px;}
  #acts{display:flex;gap:8px;flex-wrap:wrap;}
  .act{background:#1b2226;border:1px solid var(--edge);color:var(--text);border-radius:8px;
    padding:12px 17px;font-size:13.5px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;}
  .act:active{background:#252e34;}
  .slotrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0;}
  .slot{background:#141a1e;border:1px solid var(--edge);border-radius:8px;min-height:52px;
    font-size:11.5px;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:6px;line-height:1.3;}
  .slot.empty{color:#4a5257;} .slot.key{border-color:var(--key);color:var(--key);}
  .slot.selc{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel);}
  .lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:9px 0 2px;}
  .skl{border:1px solid var(--edge);border-radius:8px;padding:10px 12px;margin:6px 0;font-size:13px;}
  .skl .u{color:var(--dim);font-size:11.5px;}
</style>
</head>
<body>
<div id="app">
  <div id="narr">You wake.</div>
  <div id="stage">
    <div id="objects"></div>
    <div id="vig"></div>
    <div id="dice"><span id="dtext"></span><button id="wardbtn">ward it</button></div>
    <div id="qtebox"><div id="qtein">
      <p id="qteline"></p><div id="qtebar"><div id="qtefill"></div></div>
      <div id="qteacts" style="display:flex;gap:8px;justify-content:center"></div>
    </div></div>
    <div id="end"><p id="endline"></p><small id="endnote"></small>
      <button class="act" onclick="location.reload()">again</button></div>
  </div>
  <div id="panel">
    <div id="strip"></div>
    <div id="pager">
      <button class="pgbtn" id="pgL">◂</button>
      <div id="ptitle">actions</div>
      <button class="pgbtn" id="pgR">▸</button>
    </div>
    <div id="body">
      <div id="p_act"><div id="selname">—</div><div id="cap"></div><div id="acts"></div></div>
      <div id="p_skl" style="display:none"></div>
      <div id="p_itm" style="display:none"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ── state ─────────────────────────────────────────── */
const S = {
  hp:6,maxhp:6,san:6,maxsan:6,might:2,will:2,tithes:0,depth:1,
  room:"crossing", sel:null, pane:0, deaths:0,
  items:[], cons:[], combSel:[],     // items: {n, key?, kept?, wpn?, soak?, dmg?}
  wardKnown:false, wardUses:0,
  f:{ fontDrunk:false, altarUsed:false, corpseSearched:false, rubbleSearched:false,
      drownedSearched:false, whetTaken:false, hallAmbushed:false, robedNext:"circles",
      brotherSearched:false, pageTaken:false,
      puzzle:[], puzzleSolved:false, doorOpen:false,
      cultistHp:3, cultistGone:false,
      bossHp:8, bossNext:"circles", parryDone:false, bossDead:false,
      variant: Math.random()<0.5 ? "crooked":"flooded" },
};
const $=(i)=>document.getElementById(i);
const roll=()=>1+Math.floor(Math.random()*6);
const P=["","⚀","⚁","⚂","⚃","⚄","⚅"];
const KEEP_ONE_RANDOM = true;        // death rule toggle: keep 1 random non-key item

/* ── helpers ───────────────────────────────────────── */
function narrate(t){const n=$("narr");n.classList.add("swap");
  setTimeout(()=>{n.textContent=t;n.classList.remove("swap");},210);}
function hurt(){$("vig").classList.remove("hurt");void $("vig").offsetWidth;$("vig").classList.add("hurt");}
function weapon(){return S.items.find(i=>i.wpn)||null;}
function soak(){return S.items.reduce((a,i)=>a+(i.soak||0),0);}
function myDmg(){return weapon()?weapon().dmg:1;}
function addItem(it){ if(S.items.length>=4){narrate("Four hands' worth is all you carry. Something must be left.");return false;}
  S.items.push(it); paint(); return true;}
function addCons(n){ if(S.cons.length>=2){narrate("No room among the small things.");return false;}
  S.cons.push(n); paint(); return true;}

/* ── rooms ─────────────────────────────────────────── */
const ROOMS = {
  crossing:{ label:"the crossing · L1", enter:"A dead portal. Stone so close you can hear it.",
    tint:"#1b2024", objects:["portal","corpse","font","dcross"]},
  crooked:{ label:"the crooked passage · L1", enter:"The walls lean in to read you.",
    tint:"#1d2022", objects:["mural","rubble","backc","fwdc"]},
  flooded:{ label:"the flooded passage · L1", enter:"Black water to the ankle. It does not ripple.",
    tint:"#181e22", objects:["carving","drowned","whet","backc","fwdc"]},
  gate:{ label:"the sealed gate · L1", enter:"Three sigil stones. A door with no handle.",
    tint:"#1e1f24", objects:["lintel","sigEye","sigMouth","sigHand","altar","backg","down"]},
  hall:{ label:"the lower hall · L2", enter:"Deeper. The air is thick as wool.",
    tint:"#1a1c22", objects:["cultist","brother","page","irondoor","up"]},
  warden:{ label:"the warden's chamber · L2", enter:"It has been waiting without impatience.",
    tint:"#1c1a20", objects:["warden","fleeup"]},
};
const POS = {
  portal:[34,12,32,32], corpse:[8,64,22,20], font:[72,26,20,26], dcross:[78,68,17,24],
  mural:[10,16,24,34], rubble:[64,62,22,20], backc:[6,70,15,20], fwdc:[80,26,15,26],
  carving:[12,18,24,32], drowned:[62,60,24,20], whet:[38,66,18,15],
  lintel:[30,8,40,12], sigEye:[12,34,20,22], sigMouth:[40,34,20,22], sigHand:[68,34,20,22],
  altar:[10,70,22,20], backg:[74,72,17,20], down:[42,64,18,20],
  cultist:[38,26,24,30], brother:[8,64,22,20], page:[70,20,20,18], irondoor:[70,60,22,26], up:[6,20,15,22],
  warden:[32,18,36,42], fleeup:[6,70,16,20],
};

/* ── objects ───────────────────────────────────────── */
function A(label,run){return{label,run};}
const OBJ = {
  /* L1 · crossing */
  portal:{n:"the dead portal", r(){return{
    line:"Glass gone to slate. You came through this. It will not say so.",
    acts:[A("press your eye",()=>{ S.san=Math.max(1,S.san-1); hurt(); paintAll();
      narrate("Something on the far side presses back."); })]};}},
  corpse:{n:"a still traveler", r(){ if(S.f.corpseSearched)return{line:"You have what they carried.",acts:[]};
    return{line:"Coins rest on the eyes. A knife at the belt.",
      acts:[A("search",()=>{S.f.corpseSearched=true;S.tithes+=3;
        addItem({n:"Rusted knife",wpn:true,dmg:2,kept:true});
        narrate("Three eye-coins and a knife. They were paid to stay down here.");resel();paint();})]};}},
  font:{n:"a quiet font", r(){ if(S.f.fontDrunk)return{line:"The water is only water now.",acts:[]};
    return{line:"Clear water in all this dark. It smells like a morning you almost remember.",
      acts:[A("drink",()=>{S.f.fontDrunk=true;S.might++;S.hp=S.maxhp;paintAll();
        narrate("Strength settles into your hands like it lived there once.");resel();})]};}},
  dcross:{n:"stair down", exit:true, r(){return{line:"Down. It was always going to be down.",
    acts:[A("go",()=>go(S.f.variant))]};}},
  /* L1 · passage variants (both carry clue 1) */
  mural:{n:"a scored mural", r(){return{
    line:"Robed figures at a door. Beneath, scraped but legible: THE MOUTH SPEAKS FIRST.",acts:[]};}},
  rubble:{n:"fallen stone", r(){ if(S.f.rubbleSearched)return{line:"Only stone.",acts:[]};
    return{line:"Someone hid something here, badly.",
      acts:[A("search",()=>{S.f.rubbleSearched=true;addCons("Bandage");
        narrate("Linen, old but clean.");resel();})]};}},
  carving:{n:"a wall carving", r(){return{
    line:"A crude mouth, cut deep, cut first — the other marks crowd after it.",acts:[]};}},
  drowned:{n:"a drowned cultist", r(){ if(S.f.drownedSearched)return{line:"The water keeps the rest.",acts:[]};
    return{line:"Face down. Patient.",
      acts:[A("search",()=>{S.f.drownedSearched=true;addCons("Bandage");S.tithes+=1;
        narrate("A bandage, and one coin the water didn't want.");resel();paint();}),
      A("turn it over",()=>{S.san=Math.max(1,S.san-1);hurt();paintAll();
        narrate("You wish you had not. Its mouth is sewn.");})]};}},
  whet:{n:"a sunken whetstone", r(){ if(S.f.whetTaken)return{line:"Only silt.",acts:[]};
    return{line:"A whetstone under the black water, drowned but true.",
      acts:[A("take",()=>{ if(addItem({n:"Whetstone"})){S.f.whetTaken=true;
        narrate("Grit, and a promise for the knife.");} resel();})]};}},
  backc:{n:"back — the crossing", exit:true, r(){return{line:"Back toward the dead glass.",
    acts:[A("go",()=>go("crossing"))]};}},
  fwdc:{n:"onward — a sealed gate", exit:true, r(){return{line:"The passage ends at old iron.",
    acts:[A("go",()=>go("gate"))]};}},
  /* L1 · the sealed gate (puzzle) */
  lintel:{n:"the lintel", r(){return{
    line:"Carved above the door: WHAT SPEAKS IS SEEN. WHAT IS SEEN IS TAKEN.",acts:[]};}},
  sigEye:{n:"sigil stone", r(){return{line:"A sigil like a lidded eye.",
    acts: S.f.puzzleSolved?[]:[A("press",()=>press("eye"))]};}},
  sigMouth:{n:"sigil stone", r(){return{line:"A sigil like an open mouth.",
    acts: S.f.puzzleSolved?[]:[A("press",()=>press("mouth"))]};}},
  sigHand:{n:"sigil stone", r(){return{line:"A sigil like a grasping hand.",
    acts: S.f.puzzleSolved?[]:[A("press",()=>press("hand"))]};}},
  altar:{n:"a black altar", r(){ if(S.f.altarUsed)return{line:"It is satisfied. For now.",acts:[]};
    return{line:"It wants. It does not say what. It offers strength anyway.",
      acts:[A("offer yourself",()=>{S.f.altarUsed=true;S.might++;S.maxsan=Math.max(2,S.maxsan-1);
        S.san=Math.min(S.san,S.maxsan);paintAll();hurt();
        narrate("Strength, and a thin place where your quiet used to be.");resel();})]};}},
  backg:{n:"back — the passage", exit:true, r(){return{line:"Back through the lean of the walls.",
    acts:[A("go",()=>go(S.f.variant))]};}},
  down:{n:"the sealed door", exit:true, r(){
    if(!S.f.puzzleSolved)return{line:"No handle, no seam. The sigils are the handle.",
      acts:[A("push",()=>narrate("It does not move. The stones are watching you try."))]};
    return{line:"The door stands open on a stair breathing cold.",
      acts:[A("descend",()=>{S.depth=2;go("hall");})]};}},
  /* L2 · lower hall */
  cultist:{n:"a robed one", enemy:true, r(){ if(S.f.cultistGone)return null;
    return{line:"It watches you the way you'd watch weather.",
      cap:`hp ${S.f.cultistHp} · might 2 · next: ${S.f.robedNext==="grasps"?"grasps (harm 3)":"circles (harm 2)"} → body · pursuit 4+`,
      acts:[A("fight",()=>{const d=S.f.robedNext==="grasps"?3:2;
        S.f.robedNext=S.f.robedNext==="grasps"?"circles":"grasps";
        fight({tag:"cultist",stat:2,dmg:d,
        get:()=>S.f.cultistHp,set:v=>S.f.cultistHp=v,
        kill(){S.f.cultistGone=true;S.tithes+=2;
          narrate("It folds without complaint. Two coins in the robe.");}});}),
      A("flee",()=>flee(4,()=>narrate("You put a pillar between you. It does not follow. Yet.")))]};}},
  brother:{n:"a fallen brother", r(){ if(S.f.brotherSearched)return{line:"Bare robe, bare bones.",acts:[]};
    return{line:"One of them, long dead, armored under the robe.",
      acts:[A("search",()=>{S.f.brotherSearched=true;
        addItem({n:"Rag cuirass",soak:1});
        narrate("A cuirass of boiled rag and plates. It will remember blows for you.");resel();})]};}},
  page:{n:"a torn rite-page", r(){ if(S.f.pageTaken)return{line:"You know what it knew.",acts:[]};
    return{line:"A warding gesture, drawn stroke by stroke.",
      acts:[A("study",()=>{S.f.pageTaken=true;S.wardKnown=true;S.wardUses=2;paint();
        narrate("Your hands learn WARD before your mind agrees to.");resel();})]};}},
  irondoor:{n:"an iron door", exit:true, r(){
    return{line:"Iron, and behind it something breathing slow.",
      acts:[A("open",()=>{ if(S.depth<2){narrate("It does not move.");return;} go("warden");})]};}},
  up:{n:"stair up", exit:true, r(){return{line:"Back up toward the gate.",
    acts:[A("go",()=>{S.depth=1;go("gate");})]};}},
  /* L2 · boss */
  warden:{n:"the warden", enemy:true, r(){ if(S.f.bossDead)return null;
    return{line:"Too tall for the room, and unbothered by that.",
      cap:`hp ${S.f.bossHp} · might 3 · harm 2 → body · next: ${S.f.bossNext} · pursuit 5+`,
      acts:[A("fight",wardenRound),
      A("flee",()=>flee(5,()=>{go("hall");narrate("You leave it its room. It allows this.");}))]};}},
  fleeup:{n:"the way back", exit:true, r(){return{line:"The hall, and easier air.",
    acts:[A("go",()=>go("hall"))]};}},
};

/* ── puzzle ────────────────────────────────────────── */
const ORDER=["mouth","eye","hand"];
function press(sig){
  const want=ORDER[S.f.puzzle.length];
  if(sig===want){ S.f.puzzle.push(sig);
    if(S.f.puzzle.length===3){ S.f.puzzleSolved=true;
      addItem({n:"Sigil brand",key:true});
      narrate("Speaks, seen, taken. The door exhales open — and the stones give you their mark.");
      resel(); paint(); return; }
    narrate("The stone sinks and holds. The others wait."); return; }
  S.f.puzzle=[]; S.san=Math.max(1,S.san-1); hurt(); paintAll();
  narrate("The stones grind back to the start. Something behind the door laughs, once.");
}

/* ── combat ────────────────────────────────────────── */
function showDice(html, wardable, applyWound){
  const d=$("dice"); $("dtext").innerHTML=html; d.classList.add("show");
  const wb=$("wardbtn");
  clearTimeout(d._t);
  if(wardable && S.wardKnown && S.wardUses>0){
    wb.style.display="inline-block";
    wb.onclick=()=>{ S.wardUses--; wb.style.display="none"; applyWound(false);
      narrate("Your hands move the way the page taught. The blow lands on nothing."); paint(); };
    d._t=setTimeout(()=>{ wb.style.display="none"; d.classList.remove("show"); applyWound(true); },2400);
  } else {
    wb.style.display="none"; applyWound(true);
    d._t=setTimeout(()=>d.classList.remove("show"),2000);
  }
}
function fight(e){
  const my=roll(), its=roll(), me=my+S.might, it=its+e.stat;
  if(me>it){ e.set(e.get()-myDmg());
    showDice(`you <span class="d">${P[my]}</span>+${S.might} · it <span class="d">${P[its]}</span>+${e.stat} — it gives −${myDmg()}`,false,()=>{});
    if(e.get()<=0){ e.kill(); resel(); paint(); return; }
    resel(); paint(); return; }
  if(it>me){
    const dmg=Math.max(0,e.dmg-soak());
    showDice(`you <span class="d">${P[my]}</span>+${S.might} · it <span class="d">${P[its]}</span>+${e.stat} — it strikes`,true,(really)=>{
      if(!really){resel();return;}
      S.hp-=dmg; hurt(); paintAll();
      if(S.hp<=0){ die(); return; }
      narrate(dmg===0?"The cuirass remembers the blow for you.":"Cold iron finds you."); resel();
    });
    return; }
  showDice(`you <span class="d">${P[my]}</span> · it <span class="d">${P[its]}</span> — nothing lands`,false,()=>{});
  resel();
}
function flee(pursuit,ok){
  const r=roll();
  if(r>=pursuit){ showDice(`flee <span class="d">${P[r]}</span> · away`,false,()=>{}); ok(); paint(); return; }
  const dmg=Math.max(1,2-soak());
  showDice(`flee <span class="d">${P[r]}</span> · it closes`,true,(really)=>{
    if(!really){resel();return;}
    S.hp-=dmg; hurt(); paintAll();
    if(S.hp<=0){ die(); return; }
    narrate("It rakes your back for the insult."); resel();
  });
}
/* boss: telegraphed intent + one parry QTE at half health */
function wardenRound(){
  if(S.f.bossHp<=4 && !S.f.parryDone){ S.f.parryDone=true; parryQTE(); return; }
  if(S.f.bossNext==="winds up a heavy blow"){
    S.f.bossNext="circles";
    fight({tag:"warden",stat:4,dmg:3,get:()=>S.f.bossHp,set:v=>S.f.bossHp=v,kill:bossKill});
  } else {
    S.f.bossNext = S.f.bossHp<=4 ? "winds up a heavy blow" : (Math.random()<0.4?"winds up a heavy blow":"circles");
    fight({tag:"warden",stat:3,dmg:2,get:()=>S.f.bossHp,set:v=>S.f.bossHp=v,kill:bossKill});
  }
  resel();
}
function bossKill(){ S.f.bossDead=true;
  $("endline").textContent="The Warden kneels, because the room is too small to fall in.";
  $("endnote").textContent="two levels · five rooms · slice complete — deaths: "+S.deaths;
  $("end").classList.add("show"); }
function parryQTE(){
  const box=$("qtebox"),fill=$("qtefill");
  $("qteline").textContent="It breaks its own rhythm — the blow comes crosswise —";
  const acts=$("qteacts"); acts.innerHTML="";
  const b=document.createElement("button"); b.className="act"; b.textContent="parry";
  acts.appendChild(b);
  box.classList.add("show");
  fill.style.transition="none"; fill.style.width="100%";
  requestAnimationFrame(()=>{fill.style.transition="width 1.4s linear";fill.style.width="0%";});
  const t=setTimeout(()=>{ box.classList.remove("show");
    const dmg=Math.max(1,3-soak()); S.hp-=dmg; hurt(); paintAll();
    if(S.hp<=0){ die(); return; }
    narrate("Too slow by half a breath. It costs you."); resel(); },1400);
  b.onclick=()=>{ clearTimeout(t); box.classList.remove("show");
    S.f.bossHp-=myDmg(); paint();
    if(S.f.bossHp<=0){ bossKill(); return; }
    narrate("You turn the blow along the knife and give it back."); resel(); };
}

/* ── death: wipe all but key items (+1 random survivor) ── */
function die(){
  S.deaths++;
  const keys=S.items.filter(i=>i.key||i.kept);
  const rest=S.items.filter(i=>!i.key&&!i.kept);
  let kept=null;
  if(KEEP_ONE_RANDOM && rest.length){ kept=rest[Math.floor(Math.random()*rest.length)]; }
  S.items=[...keys, ...(kept?[kept]:[])];
  S.cons=[]; S.tithes=0;
  S.hp=S.maxhp; S.san=S.maxsan; S.wardUses=S.wardKnown?2:0;
  /* the maze digests: passage redraws; landmarks (crossing/gate/hall/warden) hold */
  S.f.variant = S.f.variant==="crooked" ? "flooded" : "crooked";
  S.f.cultistHp = S.f.cultistGone?0:3;
  S.f.bossHp = S.f.bossDead?0:8; S.f.parryDone=false; S.f.bossNext="circles";
  S.depth=1; go("crossing");
  const heldNames=S.items.map(i=>i.n.toLowerCase()).join(", ");
  narrate(S.items.length
    ? `You wake at the dead glass. What your hands kept: ${heldNames}. The walls have moved.`
    : "You wake at the dead glass with empty hands and your marks. The walls have moved.");
}

/* ── plumbing ──────────────────────────────────────── */
function roomObjs(id){ return ROOMS[id].objects.filter(o=>{
  if(o==="cultist"&&S.f.cultistGone)return false;
  if(o==="warden"&&S.f.bossDead)return false;
  return true; }); }
function go(id){ S.room=id; S.sel=null; render(); paintAll();
  narrate(ROOMS[id].enter);
  if(id==="hall" && !S.f.hallAmbushed && !S.f.cultistGone){
    S.f.hallAmbushed=true; setTimeout(ambushQTE, 700); } }
function ambushQTE(){
  const box=$("qtebox"),fill=$("qtefill");
  $("qteline").textContent="Something lunges out of the dark —";
  const acts=$("qteacts"); acts.innerHTML="";
  const b=document.createElement("button"); b.className="act"; b.textContent="dodge";
  acts.appendChild(b);
  box.classList.add("show");
  fill.style.transition="none"; fill.style.width="100%";
  requestAnimationFrame(()=>{fill.style.transition="width 1.2s linear";fill.style.width="0%";});
  const t=setTimeout(()=>{ box.classList.remove("show");
    const dmg=Math.max(1,2-soak()); S.hp-=dmg; hurt(); paintAll();
    if(S.hp<=0){ die(); return; }
    narrate("Cold fingers rake you before you even see it."); },1200);
  b.onclick=()=>{ clearTimeout(t); box.classList.remove("show");
    narrate("You twist aside. It settles back to watching, patient again."); };
}
function render(){ const host=$("objects"); host.innerHTML="";
  host.parentElement.style.background=ROOMS[S.room].tint;
  for(const oid of roomObjs(S.room)){ const o=OBJ[oid]; if(!o)continue;
    const r=o.r(); if(r===null)continue;
    const p=POS[oid]||[40,40,20,16];
    const b=document.createElement("button");
    b.className="obj"+((o.enemy)?" enemy":"")+((o.exit)?" exit":"")+(S.sel===oid?" sel":"");
    b.style.cssText=`left:${p[0]}%;top:${p[1]}%;width:${p[2]}%;height:${p[3]}%;background:${ROOMS[S.room].tint}`;
    b.textContent=o.n; b.onclick=()=>select(oid);
    host.appendChild(b); } }
function select(oid){ S.sel=oid; S.pane=0; render(); paintPane();
  const r=OBJ[oid].r(); if(!r)return;
  narrate(r.line);
  $("selname").textContent=OBJ[oid].n; $("cap").textContent=r.cap||"";
  const acts=$("acts"); acts.innerHTML="";
  for(const a of (r.acts||[])){ const b=document.createElement("button"); b.className="act";
    b.textContent=a.label; b.onclick=a.run; acts.appendChild(b);} }
function resel(){ if(S.sel && roomObjs(S.room).includes(S.sel) && OBJ[S.sel].r()) select(S.sel);
  else { S.sel=null; $("selname").textContent=ROOMS[S.room].label;
    $("cap").textContent=""; $("acts").innerHTML=""; render(); } }

/* pager */
const PANES=["actions","skills","items"];
function paintPane(){ $("ptitle").textContent=PANES[S.pane];
  $("p_act").style.display=S.pane===0?"block":"none";
  $("p_skl").style.display=S.pane===1?"block":"none";
  $("p_itm").style.display=S.pane===2?"block":"none"; }
$("pgL").onclick=()=>{S.pane=(S.pane+2)%3;paintPane();};
$("pgR").onclick=()=>{S.pane=(S.pane+1)%3;paintPane();};

function paintAll(){ document.documentElement.style.setProperty("--open",(48+S.san*8)+"%"); paint(); }
function paint(){
  $("strip").innerHTML=`<span>hp <b>${S.hp}/${S.maxhp}</b></span><span>might <b>${S.might}</b></span>`+
    `<span>will <b>${S.will}</b></span><span>◎ <b>${S.tithes}</b></span>`+
    `<span>depth <b>${S.depth}</b></span><span class="loc">${ROOMS[S.room].label}</span>`;
  $("p_skl").innerHTML = S.wardKnown
    ? `<div class="skl"><b>Ward</b> — after the dice land against you, spend to take nothing.
       <div class="u">uses left this life: ${S.wardUses}</div></div>`
    : `<div class="skl" style="color:var(--dim)">Your hands know nothing yet. The labyrinth teaches.</div>`;
  $("p_itm").innerHTML =
    `<div class="lbl">carried — four slots · tap two to combine</div><div class="slotrow">`+
    [0,1,2,3].map(i=>{const it=S.items[i];
      const selc=S.combSel.includes(i)?" selc":"";
      return `<div class="slot ${it?"":"empty"} ${(it?.key||it?.kept)?"key":""}${selc}" data-i="${i}">${it? it.n + (it.key?" ✦": it.kept?" •":"") : "—"}</div>`;}).join("")+
    (S.combSel.length===2?`<button class="act" id="combineBtn" style="margin:4px 0 2px">combine</button>`:"")+
    `</div><div class="lbl">small things — two slots</div>`+
    `<div class="slotrow" style="grid-template-columns:repeat(2,1fr)">`+
    [0,1].map(i=>{const c=S.cons[i];
      return `<div class="slot ${c?"":"empty"}" data-c="${i}" style="cursor:${c?"pointer":"default"}">${c||"—"}</div>`;}).join("")+
    `</div><div class="lbl" style="margin-top:10px">on death: all is taken, save what is marked ✦, the knife your hands have learned (•), and one thing they refuse to drop</div>`;
  $("p_itm").querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i; if(!S.items[i])return;
    const at=S.combSel.indexOf(i);
    if(at>=0)S.combSel.splice(at,1); else{ if(S.combSel.length>=2)S.combSel.shift(); S.combSel.push(i); }
    paint(); });
  const cb=$("combineBtn"); if(cb)cb.onclick=()=>{
    const [a,b]=S.combSel.map(i=>S.items[i]);
    const names=[a.n,b.n].sort().join("+");
    if(names==="Rusted knife+Whetstone"){
      S.items=S.items.filter(it=>it!==a&&it!==b);
      S.items.push({n:"Honed knife",wpn:true,dmg:3,kept:true});
      S.combSel=[]; narrate("Stone remembers edge. The knife comes back hungrier."); paint();
    } else { S.combSel=[]; narrate("These want nothing from each other."); paint(); }
  };
  $("p_itm").querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.c; if(S.cons[i]!=="Bandage")return;
    if(S.hp>=S.maxhp){narrate("Nothing to bind.");return;}
    S.cons.splice(i,1); S.hp=Math.min(S.maxhp,S.hp+2);
    narrate("You bind the worst of it."); paintAll(); });
}

/* ── boot ──────────────────────────────────────────── */
render(); paintAll(); paintPane();
setTimeout(()=>narrate(ROOMS.crossing.enter),2300);
</script>
</body>
