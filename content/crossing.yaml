# content/crossing.yaml — where the portal spat you out (CANON.md).
#
# Tier T0: physical residue only. Scraped hands, a weight the arms remember, a
# cry in dreams. Never "child", never "brother", nothing about why.
#
# The reference behaviour lives here: the door refuses, the scored stone
# teaches, the same tap opens. A refusal names what you lack in the world's own
# terms and points somewhere — never "not now", never "you can't".
scene: crossing
enter: "The ring of the portal is cold all through, and nothing is coming back through it."
tier: T0

objects:
  portal:
    tap: "It's a portal, and it's dead. Cold stone, and a rim worn smooth by hands going one way."
    actions:
      touch:
        - say: "The stone takes the heat out of your palm and gives nothing back. Whatever it cost to come through, it has already been paid."

  hands:
    tap: "Your hands. The knuckles are opened and you don't know on what."
    actions:
      look:
        - say: "Scraped raw across all four knuckles. Whatever you were holding, you held it hard, and for a long way."
          journal: scraped_hands

  stone:
    tap: "A block set into the wall at chest height, scored over with a shape."
    actions:
      study:
        - if: { flags: [knows_mark] }
          say: "The same shape. A ring, and a line falling through it."
        - say: "A ring with a line falling through it, cut deep enough to read with a thumb. Your hands know it before you do."
          set: [knows_mark]
          journal: the_mark

  door:
    tap: "A low door, barred from this side. The same shape is burned into the wood at eye height."
    actions:
      open:
        - if: { flags: [knows_mark] }
          say: "You lift the bar. The shape on the wood is the shape on the stone, and the door is only a door."
          set: [door_open]
          journal: the_way_down
        - refuse: true
          say: "The mark on the wood means something. Not to you, and not to your hands."
      listen:
        - say: "Nothing on the other side. Not silence — the sound of a place too big to hear the end of."

  steps:
    tap: "Steps going down past the door, and the dark takes them three treads in."
    actions:
      descend:
        - if: { flags: [door_open] }
          say: "The cold comes up the steps to meet you. You go down into it."
          end:
            line: "The dark takes the third tread, and then you."
            note: "left the Crossing"
        - refuse: true
          say: "The door is barred between you and them."
