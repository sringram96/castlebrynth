# BROKEN ON PURPOSE — a fixture, not content.
#
# Everything under content/fixtures/ is authored wrong so that the compiler can
# be shown refusing it (src/core/compile.test.ts). Nothing here is a room the
# game may draw: a build that walks content/rooms/ never meets these files, and
# it must stay that way.
#
# THE MISTAKE: one anchor, aliased a hundred times.
#
# This is the only fixture here that is not really an authoring mistake at all.
# The `yaml` package defends itself against a billion-laughs expansion by
# counting how often each anchor is resolved, and past its limit — 100 uses of
# one anchor — it does not report a problem the way it reports a tab or a
# repeated key. It THROWS, and it throws while the aliases are being expanded,
# which is `doc.toJS()` and not the parse.
#
# 100 is not a hostile number and this file is not a bomb: it is one anchored
# tap reused down a long row of alcoves, which is the obvious thing to write
# when a room repeats itself. The alcoves are deliberately bare — no actions —
# because the subject of this file is the alias count and nothing else, and a
# fixture with one variable in it is the one the next author can read.
#
# What is asserted is that the compiler ANSWERS this file instead of dying on
# it. A thrown error names no file, and a throw part-way through a build means
# every file after it goes unread: an author fixing content would get one stack
# trace and no idea which of forty rooms produced it. That is the opposite of
# this card's goal, which is a problem that says where.
#
# EXPECTED, and asserted:
#   (root) — the YAML parser gave up on this file rather than reporting a
#            problem in it ... 100 uses of one anchor

id: room:bad-alias-storm
tier: T0
still: still:bad-alias-storm
line: A long row of alcoves cut into the wall. Every one of them the same.

doors:
  - id: door:on
    sense: Light under the far door.
  - id: door:down
    sense: Cold air off the near stair.

objects:
  way:
    tap: Two doors, both shut.
    actions:
      go:
        - say: You go on.
          goto: door:on
      down:
        - say: You go down.
          goto: door:down

  # The first alcove holds the anchor. Every alcove after it is the same alcove.
