%YAML 1.3
---
# BROKEN ON PURPOSE — a fixture, not content.
#
# Everything under content/fixtures/ is authored wrong so that the compiler can
# be shown refusing it (src/core/compile.test.ts). Nothing here is a room the
# game may draw: a build that walks content/rooms/ never meets these files, and
# it must stay that way.
#
# THE MISTAKE: a version the parser does not have, stated as if it did.
#
# `%YAML 1.1` is refused BY NAME up in compile.ts, because 1.1 is a real schema
# and a real trap — the Norway problem. This file is the other half of that
# check, and it is the half that leaked. There is no YAML 1.3. The parser does
# not say so through `doc.errors`; it normalises `directives.yaml.version` to
# "1.2", reads the file as 1.2 anyway, and files the complaint under
# `doc.warnings`. So a compiler reading only `doc.errors` sees a file that
# declares 1.2 — because the parser rewrote the answer before the question was
# asked — and the hand-rolled `%YAML` check above it can never fire.
#
# An author states a version, the parser overrules it, and the file compiles
# with no word said. That is the exact failure the duplicate-key check exists to
# refuse, arriving through the check written to prevent it.
#
# EVERY OTHER LINE IN THIS FILE IS CORRECT, on purpose — ignore the warning and
# it compiles clean. compile.test.ts asserts both halves.
#
# EXPECTED, and asserted:
#   (root) — Unsupported YAML version 1.3 at line 1, column 7 (yaml
#            BAD_DIRECTIVE). ...

id: room:bad-yaml-version
tier: T0
still: still:bad-yaml-version
line: A landing, and a stair. The boards have been counted and marked.

doors:
  - id: door:on
    sense: Light under the far door, low and steady.
  - id: door:down
    sense: Cold air off the near stair.

objects:
  way:
    tap: Two doors, both shut.
    actions:
      go:
        - say: You go on. The light does not change.
          goto: door:on
      down:
        - say: You go down. The cold comes up to meet you.
          goto: door:down

  boards:
    tap: Numbers on the boards, cut small. They do not run in order.
    actions:
      peer:
        - say: Eleven, then four, then nine. Somebody keeps a count of something.
