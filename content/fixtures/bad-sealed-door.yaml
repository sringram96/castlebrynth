# BROKEN ON PURPOSE — a fixture, not content. See bad-unknown-word.yaml.
#
# THE MISTAKE: a whole-card law, and it is the one cards.ts calls "the one that
# bites". Every act is addressed to an object and an action (types.ts `Intent`)
# and a door is not an object, so a door is reachable only through some object's
# `goto`. This room senses three doors and walks through two. The third is a
# road painted on a wall: the player is offered a choice that does not open.
#
# Nothing is misspelled here and no word is unknown. Every line of it is legal
# on its own — which is the point. The problem is a property of the whole card.
#
# EXPECTED, and asserted:
#   doors[2].id — "door:sump" is sensed but nothing goes through it

id: room:bad-sealed-door
tier: T0
still: still:bad-sealed-door
line: A landing. Ways off it in three directions, and the boards are wet.

doors:
  - id: door:on
    sense: Light under the far door.
  - id: door:down
    sense: Cold air off the near stair.
  - id: door:sump
    sense: Water moves somewhere under the boards, steady and slow.

objects:
  way:
    tap: Two doors, both shut. The floor between them is boards.
    actions:
      go:
        - say: You go on.
          goto: door:on
      down:
        - say: You go down.
          goto: door:down
