# content/gate.yaml — the sealed gate, at the top of the path (MVP.md §1).
#
# The shore taught you to read. The gate asks you to look: a locked thing, a
# dead thing holding what opens it, and a wall of writing you can only half
# use. Nothing here kills you and nothing here springs.
#
# The gate opens once. The second `open` is a say and nothing else — an open
# gate turned nobody away, so it does not reach the ledger, and it has no
# delta left to fire. The bearer is the same: one search, one key, one entry.
#
# Tier: T1 (CANON.md §knowledge tiers). The mural may carry the crossing and
# the memory it costs. It may not carry who takes it — that is T2 and above,
# and LAWS.md #spoiler is not a taste.
#
# H111 hangs an `exit` here, gated on gate_open. It is not built in this file.
id: gate
line: "The path ends at iron. The hill has been cut open and shut again."
objects:
  - id: iron_gate
    name: "a gate of black iron"
    actions:
      open:
        # First, or the branch below it would ask for a key the gate has
        # already eaten and fall through to the refusal.
        - gate: { flag: gate_open }
          say: "The gate stands where you left it, swung in. The cold coming through it is older than the cold on this side."
        - gate: { item: rusted_key }
          setFlag: gate_open
          removeItem: rusted_key
          say: "The key turns once, hard, and something in the iron lets go. The gate swings in as far as the hinges will carry it. The key stays in the slot, and you leave it there."
        # LAWS.md #gates — a blocked way declares its key. The narrator names
        # the thing, never the engine's name for it.
        - refuse: "The gate does not move. The keyway is a slot the length of your finger, cut for a key you are not carrying."

  - id: dead_bearer
    name: "a bearer, sat against the stone"
    actions:
      search:
        - gate: { notFlag: bearer_searched }
          setFlag: bearer_searched
          addItem: rusted_key
          journal: "bearer"
          say: "He went down sitting and stayed sitting. The straps are still over his shoulders and the pack under them is empty. In the fold of his belt is a key, rusted through at the ring and whole where it has to be."
        - say: "There is nothing more on him. His hands are turned up and open."

  - id: mural
    name: "a mural cut into the wall"
    actions:
      read:
        - gate: { flag: knows_glyph, notFlag: toll_read }
          setFlag: toll_read
          journal: "toll"
          say: "The mark from the stone runs all through it, and once you hold one mark the rest come loose. It is a procession. Every figure walks to the water carrying something, and walks out of it carrying nothing. The line cut under them is a price, and the price is the crossing itself: what you pay to come over is the memory of coming over."
        - gate: { flag: knows_glyph }
          say: "The procession runs the way it ran before. The wall has said its one thing."
        # Gateless, and it is a whole answer: a wall of writing is a wall of
        # writing whether or not you can hold it.
        - say: "The carving goes from the floor to above your head. Figures in a line, and marks between them that will not hold still long enough to be marks."
