# content/corridor.yaml — the corridor mouth, past the gate (MVP.md §1).
#
# The third scene, and the end of the P1 slice. The gate was a thing to open;
# this is a thing to read. Nothing here springs and nothing here costs — the
# floor is a warning, and P1 has nothing to collect on it.
#
# On the floor. H210 hangs a trap off these stones in P2. The telegraph is
# built now and it is built first (LAWS.md #telegraph): the band sits lower,
# the dust has run off its edges, and the stone either side is worn by being
# stepped on. That is the whole of what the floor owes anybody, and it is paid
# before the trap exists to be paid for.
#
# On the alcove. H212 puts a merchant in it in P2. Until then it is an alcove:
# a place, cut for a lamp, with soot in it. It affords a look and the look is a
# whole answer (LAWS.md #affordance). It sets nothing, keeps nothing, and holds
# no space open with a flag nobody reads — a placeholder object, not a
# placeholder mechanism (.llm/rules/no-dead-scaffolding.mdc).
#
# On the crossing. The card calls for an `end` delta. VOCAB.md lists one and
# the engine has none — DELTA_ORDER (src/core/cards.ts) is nine words and
# `end` is not among them — and widening the vocabulary is an amendment card,
# not a content card (AGENTS.md law 4). So the crossing is spelled in the
# words that exist: it says its line and it sets `crossing_taken`, which is
# the mark on the run that the descent was taken and the slice is over. The
# shell reads that mark to draw its end card (H100). When `end` arrives with
# its own card, it replaces this line and nothing else.
#
# It does not `goto`. There is nowhere below to go to in P1, the way back up
# must stay standing (LAWS.md #softlock), and a crossing that walked you back
# to the gate would not be a crossing.
#
# Tier: T1 (CANON.md §knowledge tiers). Cut stone, dust, soot, cold. The dark
# below is a dark; who is in it is T2 and is not this file's to know.
id: corridor
line: "Past the gate the passage runs straight, and then runs out of light."
objects:
  - id: dust_floor
    name: "the floor, under a skin of dust"
    actions:
      inspect:
        - gate: { notFlag: floor_seen }
          setFlag: floor_seen
          journal: "dust"
          say: "The dust lies even from wall to wall and nothing has walked it. Halfway down, a band of flagstones sits a finger lower than the rest, and the dust has run off their edges into the seams. The stone on either side of the band is worn hollow, the way a step is worn by being taken."
        # Gateless, and it says the same thing the floor said the first time.
        # Nothing here clears the flag: a floor cannot become unread.
        - say: "The band of stone sits where it sat. The dust over it has not moved."

  - id: lamp_alcove
    name: "an alcove cut in the wall"
    actions:
      look:
        - say: "The alcove is cut at shoulder height and it is empty. The stone at the back of it is black with smoke, and the black stops in a clean line, the way it does where something stood in front of it for a long time."

  - id: dark_crossing
    name: "the dark, where the corridor gives out"
    actions:
      cross:
        - setFlag: crossing_taken
          say: "You walk to where the light stops, and keep walking. The floor tilts down under you and goes on tilting. The cold coming up is the cold that was on the far side of the gate, and it has been standing here the whole while."

  - id: exit
    name: "the way back to the gate"
    actions:
      follow:
        - goto: gate
          say: "You go back up the passage and stand in the gateway. The iron has kept its own cold and gives you none of yours back."
