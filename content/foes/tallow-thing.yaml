# THE TALLOW THING — the chaff of the skeleton pool, and the fight
# content/rooms/the-drying-room.yaml opens.
#
# A foe card is `Foe` minus the field grammar.yaml owns: the body and the
# intents are here, the pursuit chance and the name are in grammar.yaml's
# `enemies`, and src/lots/foes.ts joins them. Nothing in this file bends the
# grammar and nothing in it can.
#
# ── the numbers, and where they come from ────────────────────────────────────
#
# F2 bone standard: "TTK chaff 2–3". Measured against the hand this game
# actually ships — six plain bones, EV 3.5 each, scored `sum × tier` — a throw
# of the whole hand averages 61 and a throw of four with two held back averages
# 27. So a chaff body is two to three of the second kind of turn:
#
#     72 ÷ 27 ≈ 3 turns holding two back      72 ÷ 43 ≈ 2 turns holding one
#
# and a player who throws everything ends it in two and blocks nothing while
# they do. That is the trade the block math already makes ("each held die blocks
# 1", DESIGN §the lots) and this body is sized so that both answers are real.
#
# The intents are DETERMINISTIC — read by turn, never rolled, which is the whole
# of "enemies never roll" — and they are shaped so the fight has an end in
# sight: 5, then a slack turn, then 8 on the turn a chaff is expected to die on.
# Against four dice held that is 1, 0 and 4; against six held it is nothing at
# all, which is what BRACE is for and why bracing here wins no fights.
#
# Balance is not proven by this file and does not claim to be — F-law proving is
# L007's, and until it lands these numbers are an honest starting guess with the
# arithmetic written next to them rather than a number nobody can argue with.

id: tallow-thing
hp: 72
intents: [5, 3, 8]
