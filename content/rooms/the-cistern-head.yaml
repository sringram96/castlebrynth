# THE CISTERN HEAD — the gated door, and the key sits one room earlier.
#
# The gate is on an ITEM — `item:brass-tally`, given in
# content/rooms/the-lamp-corridor.yaml — and not on knowledge, deliberately. A
# key you carry is a key death takes unless it is marked, and the tally is marked
# `keep: key`: "death takes it, except ✦ key and • kept items" (DESIGN
# §ledgers). So the gate is satisfiable on the push it is met, and it stays
# satisfiable after a death that happens below it. Nothing here is marked
# `cross_push`, because nothing here needs to be: `cross_push` is the author's
# declaration that a clue is NOT promised inside the push (cards.ts `Gate`), and
# this one is.
#
# ── the grate is two actions, not one ────────────────────────────────────────
#
# OPENING it and GOING DOWN it are separate acts, and the split is not manners.
# A single `lift` that opened the grate and walked through it in one response
# would leave nowhere for what is on the other side to stand. So `lift` raises
# `flag:grate-open` and stops, and `go` reads that flag and takes the door. The
# far side is met between the two, and D005 is what is standing there.
#
# ── the threshold, and why it is behind the gate rather than beside it ───────
#
# The depth-1 boss is met on the way DOWN the grate, which is the only way this
# card can say "behind the gated door" and mean it: where a door LEADS is bound
# at draw time from the depth's pool (src/core/doors.ts) and no card names
# another room, so a boss authored into a room on the far side would be a boss
# the draw might not deal. Put on the act of going through, it is exactly as
# reachable as the gate is, and the gate is keyed on the tally.
#
# `threshold` arrives LATENT, added by the response that opens the grate, for
# the stated cause — "adds/removes carry a cause" (DESIGN §content laws) — and
# nothing ever removes it. It is the telegraph and it is free: tap it and peer
# at it for nothing, before the act that costs. Its actions carry no `fight`;
# the fight is on the grate's `go`, because GOING DOWN is what meets it.
#
# FLEEING PUTS YOU PAST IT, and that is DESIGN's sentence, not a mercy: "fleeing
# ends the fight, pursuit may land one parting harm, and the room's door draw
# stands — forward is still the only way" (§the lots). So `flag:threshold-met`
# is raised by the meeting and not by winning it, and the response above reads
# that flag and takes the door. A boss that had to be killed to be passed would
# make FLEE a word that is offered and does not work.
#
# ── the refusal is the telegraph ─────────────────────────────────────────────
#
# Both fallbacks here `refuse`, and a refusal is remembered (types.ts `Refusal`,
# CampaignBranch.refused) — "refusals + clues pay off on later meetings" (DESIGN
# §the descent). Each one names what is missing in the room's own words: the slot
# is cut for a tally, and the shut grate has nothing to take hold of. A player
# who is refused here has been told where to look, and the labyrinth has written
# down that they were told.
#
# A refusal carries no delta but its line (cards.ts `Deltas.refuse`), so neither
# of these marks, gives or moves you. That is the whole of why they are refusals
# and not ordinary responses with a sad line in them.

id: room:the-cistern-head
tier: T0
still: still:the-cistern-head
line: The head of a cistern. An iron grate in the floor, and water under it.

doors:
  - id: door:the-grate
    sense: The grate in the floor. Water moving under it, and the sound coming up.
  - id: door:the-dry-channel
    sense: A dry channel cut across the floor and out. A draught in it, smelling of soot.
  - id: door:the-low-room
    sense: A doorway. In the room past it a light burns low, and it burns steadily.

objects:
  grate:
    tap: An iron grate set flush in the floor. A brass lock-plate, and a slot in it.
    actions:
      listen:
        - say: Water below, moving at one speed. Under the water, nothing at all.
      lift:
        - if:
            flags: [flag:grate-open]
          say: The grate stands up on its hinge where you left it. The water is loud.
        - if:
            items: [item:brass-tally]
          say: The tally goes into the slot and turns. The grate comes up on its hinge.
          set: [flag:grate-open]
          journal: Opened the cistern grate with the brass tally.
          addObject:
            object: threshold
            cause: the grate is open, and the shaft under it is not empty
        - refuse: true
          say: The grate does not lift. The slot in the lock-plate is cut for a tally.
      go:
        - if:
            flags: [flag:threshold-met]
          say: You go down past it. The rungs are wet, and warm, and they hold.
          goto: door:the-grate
        - if:
            flags: [flag:grate-open]
          say: You put a foot on the top rung. What is standing in the shaft comes up.
          set: [flag:threshold-met]
          journal: Went down into the cistern shaft. Something was already in it.
          fight: the-threshold
        - refuse: true
          say: The grate is shut and flush, and there is nothing to take hold of.

  threshold:
    latent: true
    tap: The shaft under the grate is filled. Whatever fills it has not moved.
    actions:
      peer:
        - say: It stands on the ladder with its back to the water. It is the shaft's width.
      listen:
        - say: The water below it is loud. Whatever is on the ladder makes no sound at all.

  channel:
    tap: A dry channel cut across the floor and out through the wall. Soot in it.
    actions:
      peer:
        - say: The soot lies in the bottom in a line, old, and it is not disturbed.
      follow:
        - say: You follow the channel out. The soot does not come off on your hands.
          goto: door:the-dry-channel

  doorway:
    tap: A doorway in the far wall. Past it a light burns low and does not move.
    actions:
      go:
        - say: You go through. The light past the doorway stands further off than it looked.
          goto: door:the-low-room
