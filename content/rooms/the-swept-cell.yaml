# THE SWEPT CELL — the empty room. Nothing is here, and that is the content.
#
# "Rooms draw fresh per push from an authored pool" (DESIGN §the descent), and a
# pool in which every room pays out is a pool with no weather in it. This one
# gives nothing: no item, no fight, no adjust, no tithe. It is not a filler room
# — a room that only takes a tap and answers nothing would be. It is a room
# whose whole content is what has been done to it, read off surfaces: the dust
# is swept into a quarter-circle by a broom that is not here, the plaster is
# washed to a height nobody standing on this floor could reach, and the cell door
# has no lock on either side.
#
# "Voice: quiet, concrete, unsentimental; dread through specificity" (DESIGN
# §world & voice). Every line here is a measurement. Nothing is named, nothing is
# concluded, and the card contains no sentence about how any of it is to be
# taken — "journal records acts, never morals" (DESIGN §content laws) is the law
# for the journal and it is the habit for the prose.
#
# T0, and it stays there: residue only. What washed the wall is not said, not
# hinted at by a second voice, and not counted as one of the three breadcrumbs a
# revelation needs. There is no revelation here to breadcrumb.
#
# ── the one guarded response ─────────────────────────────────────────────────
#
# `dust.peer` raises knowledge and writes a journal line, so it is guarded by
# the very id it raises: read it twice and the second reading answers without
# writing anything. Every other action in this card carries no delta at all, so
# every other action is free to repeat forever — which is what an object with
# nothing to give looks like when it is written honestly.

id: room:the-swept-cell
tier: T0
still: still:the-swept-cell
line: A cell, swept out. The dust is in one corner and the broom is not here.

doors:
  - id: door:the-cell-door
    sense: The cell door, standing open. The passage past it runs on, and it is unlit.
  - id: door:the-drain
    sense: A drain in the corner, its grate lifted off. Water moving, a long way down.

objects:
  dust:
    tap: The dust is swept into the corner in a quarter-circle, and left there.
    actions:
      peer:
        - if:
            flags: [knowledge:the-cells-are-swept]
          say: Grit, hair, dry mortar. The quarter-circle is exactly as it was.
        - say: Grit, hair, and a little dry mortar. No prints in it but the ones you make.
          set: [knowledge:the-cells-are-swept]
          journal: Looked at the dust swept into the corner of a cell. No prints in it.

  walls:
    tap: Plaster over stone. It has been washed, and the washing went up the wall.
    actions:
      peer:
        - say: Washed to the ceiling, evenly, and above the height of a hand on this floor.

  cell-door:
    tap: The cell door stands open against the wall. No lock on it, on either face.
    actions:
      peer:
        - say: No lock, no hasp, and no holes where either has been taken off.
      go:
        - say: You go out into the passage. The floor past the doorway has not been swept.
          goto: door:the-cell-door

  drain:
    tap: A drain in the corner, wide. Its grate is off and set flat against the wall.
    actions:
      listen:
        - say: Water below, moving. It does not sound like water that is falling.
      climb:
        - say: You go down feet first. The grate stays where somebody set it.
          goto: door:the-drain
