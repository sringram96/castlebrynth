# THE LAMP CORRIDOR — the flavour room, and the room the key sits in.
#
# Two jobs, and the second is the one a graph pass will care about. "A
# clue-locked gate draws its clue earlier in the push or is marked cross_push"
# (DESIGN §the descent): content/rooms/the-cistern-head.yaml gates its grate on
# an ITEM rather than on knowledge, and this is the room that item comes from.
# The gate there is not marked `cross_push`, so the tally must be reachable
# inside the push — which is a property of the POOL and of the draw, and neither
# cards.ts nor the content lint can see it (cards.ts, "what is NOT checked";
# scripts/content-lint.mjs, "the law battery"). It is asserted instead in
# src/core/content.test.ts, over the compiled pool, which is the smallest place
# the claim is true in.
#
# ── the dialogue ─────────────────────────────────────────────────────────────
#
# "Corridors move, landmarks hold; residents treat it as weather" (DESIGN §world
# & voice). The lamplighter is that sentence and nothing more: not cult, not a
# merchant (deferred past H180), and carrying no knowledge above T0. They talk
# about the lamp. The tally is given because they do not want to go down to the
# cistern, which is a reason a person has, not a quest.
#
# The lamplighter's pronoun is `they`, and it is a choice rather than a default:
# nothing in this game's voice is served by a description of a body.
#
# ── the shape to copy ────────────────────────────────────────────────────────
#
# `speak` is three responses deep and it is the pattern every repeatable
# dialogue here uses: the SPENT line first, gated on what the giving response
# raised, so the gift cannot be taken twice; then the giving response, gated on
# the beat before it; then the ungated fallback that always answers. A list that
# ends on a gate does not load (cards.ts `Responses`).

id: room:the-lamp-corridor
tier: T0
still: still:the-lamp-corridor
line: A corridor lit end to end. Lamps down both walls, and one of them is out.

doors:
  - id: door:the-far-end
    sense: The corridor runs on past the last lamp and the light stops at a line.
  - id: door:the-side-hatch
    sense: A hatch at knee height, standing open. Cold air comes out of it, and dust.

objects:
  lamplighter:
    tap: A lamplighter up a step-ladder, trimming a wick. They do not look down.
    actions:
      speak:
        - if:
            flags: [flag:tally-taken]
          say: '"You have the tally," they say. "Cistern grate. I do not go down there."'
        - if:
            flags: [flag:lamp-spoken]
          say: '"Take the tally off my belt," they say. "It opens the cistern grate."'
          give:
            - id: item:brass-tally
              keep: key
          set: [flag:tally-taken]
          journal: Took the brass tally off the lamplighter's belt.
        - say: '"That one goes out when the corridor turns," they say. "Weather."'
          set: [flag:lamp-spoken, knowledge:corridors-turn]
          journal: Spoke to the lamplighter. They call the moving corridors weather.
      listen:
        - say: They hum four notes and stop, and then they hum the same four again.

  dead-lamp:
    tap: The one lamp that is out. Its glass is clean and its reservoir is full.
    actions:
      peer:
        - say: Full oil, clean glass, wick trimmed to a length. Nothing is wrong with it.

  far-end:
    tap: The end of the lit run. Past the last lamp the light stops at a line.
    actions:
      go:
        - say: You walk to the line the light stops at, and then you walk past it.
          goto: door:the-far-end

  hatch:
    tap: A hatch at knee height, standing open. Cold air and dust come out of it.
    actions:
      listen:
        - say: The cold air moves steadily. Whatever it comes off does not stop.
      enter:
        - say: You go through on your hands. The dust on the floor beyond is unmarked.
          goto: door:the-side-hatch
