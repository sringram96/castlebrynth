# content/shore.yaml — the shore. The reference scene (CANON.md §the shore).
#
# The whole of P0 is here: the book refuses, the stone teaches, the same tap
# opens. P0 left the path as a door that was open and not walked through —
# there was no second scene, and a goto with no scene behind it fails the lint
# (H005). P105 walks through it: the gated branch of `follow` now carries
# `goto: stair`. Nothing else on this shore moves.
id: shore
line: "Grey water, and no far side to it."
objects:
  - id: stone
    name: "a flat stone"
    actions:
      study:
        - setFlag: knows_glyph
          say: "The stone is warm where nothing else is. A mark is cut into the top of it, deep enough to read with your thumb."

  - id: book
    name: "a book, face up in the shingle"
    actions:
      read:
        - gate: { flag: knows_glyph }
          setFlag: book_open
          journal: "procession"
          say: "The marks hold still. They are names in a line, all walking the same way."
        - refuse: "The marks swim. You cannot hold them."

  - id: pool
    name: "a pool in the rock"
    actions:
      look:
        - say: "The pool is shallow and clear. Your face does not arrive in it."

  - id: self
    name: "yourself"
    actions:
      listen:
        - say: "You hold still and listen. There is your breath, and the water, and nothing under either."

  - id: path
    name: "a path inland"
    actions:
      follow:
        - gate: { flag: book_open }
          goto: stair
          say: "The path climbs off the shingle and inland. It runs the way the names run in the book."
        - refuse: "The path goes up into the dark. You have no name for what is at the top of it."
