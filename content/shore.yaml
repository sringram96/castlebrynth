# shore.yaml — the reference scene (card H003).
#
# Shape per skill:content and src/core/cards.ts: a scene declares its
# knowledge tier, one arrival line and one standing line, then objects
# keyed by id. Every object is a free tap. Every action is a list of
# responses read top to bottom — the first whose gates all hold answers,
# and the list ends in the gateless fallback that always can.
#
# Gates and deltas are VOCAB.md words and nothing else. `goto` names a
# door ref, not a scene: the draw engine binds doors.
#
# The beat this fixture exists for: the book refuses, the refusal is
# remembered, the stone teaches, and the same tap opens.
scene: shore
tier: T0
enter: "Cold shingle. Black water finding its level."
line: "The shore. The water does not move."
objects:
  stone:
    tap: "A shelf of stone above the waterline. Cuts in the face of it, deliberate."
    actions:
      study:
        - if: { flags: [knows_glyph] }
          say: "The same mark, cut and cut again. It walks downhill."
        - say: "You put a thumb in the cuts and follow them. A figure. A road. A door standing open. The shape stays with you."
          set: [knows_glyph]

  book:
    tap: "A book, open, face up on the stone. Swollen with river water."
    actions:
      read:
        - if: { flags: [read_book] }
          say: "The page has given what it has. The ink is going."
        - if: { flags: [knows_glyph] }
          say: "A procession, inked crude. Something small, held close."
          set: [read_book]
          journal: procession
        - refuse: true
          say: "The ink swims. A script you don't know."

  pool:
    tap: "A pool caught between two ribs of rock. It holds the light and gives nothing back."
    actions:
      reach:
        - if: { flags: [knows_glyph] }
          say: "Cold to the elbow. A cut edge under the silt. The mark again, face down."
          journal: pool_mark
        - say: "Cold to the wrist. The bottom is further down than the pool is wide."

  self:
    tap: "Your hands. Both palms scraped raw. Your arms hold the shape of something heavy."
    actions:
      search:
        - say: "Nothing in the pockets. Wet cloth, and grit drying in the seams."

  path:
    tap: "A path off the shingle, going down. The air coming up it is colder than the water."
    actions:
      take:
        - say: "You go down. The shingle gives out and the steps begin."
          goto: down
