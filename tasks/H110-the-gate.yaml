goal: |
  content/gate.yaml — the second scene.

    iron gate    locked. `open` without the key refuses, and the refusal
                 wants the key by name. With rusted_key: consumes it, sets
                 gate_open, and the gate opens. Once.
    dead bearer  `search` once -> gives rusted_key, and a journal entry
    mural        fallback for a script you cannot read; with knows_glyph a
                 deep read gives a T1 toll-lore journal entry

  The shore's `path follow` regains its goto and points at the gate.

  Stay inside the tier (CANON.md, TRUTH.md): the mural may say what the toll
  was, and may not say who takes it.
