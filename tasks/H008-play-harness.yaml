id: H008
title: Terminal play harness
goal: >
  scripts/play.mjs - play the atom in Node: prints the narrator line,
  numbered objects and actions from getView, reads stdin, applies act.
  Ugly on purpose; it exists so a human can feel the loop before any
  pixel exists.
context: [P0.md, skill:engine]
deps: [H006]
scope:
  - scripts/play.mjs
  - tests/acceptance/H008.play.test.ts
non_goals: ["No colors, no UI ambitions - the shell is P1."]
allows_deps: []
acceptance:
  spec: >
    Spawning the script and scripting stdin (tap book, study stone,
    read book, quit) produces output containing the refusal line, the
    teaching line, and the procession line, exiting 0. npm run play is
    wired.
  commands:
    - npx vitest run tests/acceptance/H008.play.test.ts
