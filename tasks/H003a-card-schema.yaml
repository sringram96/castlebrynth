id: H003a
card: H003
half: A
title: Content card schema types
lane: factory
deps: [H001a]
scope:
  - src/core/cards.ts
  - src/core/cards.test.ts
acceptance: tests/acceptance/H003.schema.test.ts
done_when: npm run law green (schema type tests); the H003a blocks of the acceptance pass
goal: |
  The shape agents will author content in, forever.

  Export GATE_WORDS and DELTA_ORDER exactly as VOCAB.md lists them — the
  delta order is the application order and the acceptance pins it.

  Types: Gate, Response, ObjectCard, Scene, Bundle.

  ObjectCard carries an optional `hidden: boolean` — an object present in
  the scene file but not visible until an addObject brings it in.

  And parseScene(raw: unknown): Scene — validates and normalises:
    - unknown gate or delta word  -> throw, naming the path
      ("objects.book.read[0].setFlagg")
    - scalar args normalise to arrays ("a" -> ["a"])
    - a response list whose last response has a non-empty gate -> throw
      (VOCAB.md: the last response must be a gateless fallback)
    - a response carrying `refuse` plus any other delta -> throw
      (VOCAB.md refuse purity)
notes: |
  parseScene is pure — it takes an already-parsed value, never a file path.
  src/core does no I/O (RULES.md 1).
