goal: |
  The panel that is always there.

    renderPanel(root: HTMLElement, state: GameState): void

  Shows the journal (in order, newest last) and what you carry. Present from
  the first frame — empty, not absent, so the person learns it exists before
  it has anything in it.

  An empty journal reads as an empty journal, not as a message about being
  empty. LAWS.md economy: the journal is not a log; if it fills with noise
  the person stops reading it, and the shell must not add to it.

  The panel never shows flags. Flags are the engine's memory, not the
  person's — and `obj+:`/`obj-:` entries in particular are engine
  bookkeeping (.llm/rules/determinism.mdc) that must never reach a screen.
notes: |
  Read state directly for the journal and items; that is what GameState is
  for. Everything about the scene still comes from getView.
