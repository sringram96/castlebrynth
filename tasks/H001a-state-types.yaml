goal: |
  The state half of the contract hub.

  GameState { scene, flags, items, journal, refused, rng, seed } — exactly
  those seven keys, no more. It must survive JSON.stringify and
  structuredClone deep-equal (.llm/rules/determinism.mdc): arrays, not Sets; numbers, not
  Dates; plain objects only.

  Plus tiny pure helpers beside it: emptyState(scene, seed), hasFlag,
  hasItem, withFlag, withoutFlag, withItem, withoutItem, refKey. Every
  `with*` returns new state and never touches its argument. Membership is
  insertion-ordered and de-duplicated.

  refKey({object, action}) is the ledger key: "book.read".
notes: |
  `rng` is a plain uint32 — H002 owns how it advances, you only declare it.
