id: P101
card: P101
phase: P1
title: Shell bootstrap (Vite)
lane: factory
deps: []
scope:
  - vite.config.ts
  - index.html
  - src/shell/mount.ts
  - src/shell/mount.test.ts
  - package.json
  - package-lock.json
acceptance: tests/acceptance/P101.shell.test.ts
done_when: npx vitest run tests/acceptance/P101.shell.test.ts
goal: |
  Stand the shell up. No game yet — a build that works and a mount point.

    index.html          one <div id="app">, no inline script beyond the module tag
    vite.config.ts      root at repo root, build.outDir = "dist"
    src/shell/mount.ts  mount(root: HTMLElement, game): void  — the single entry
                        the renderer (P102) will fill in

  package.json gains: `vite@^5` + `happy-dom` devDependencies. Pin vite to ^5 --
  vitest 2.1.9's peer is vite ^5 and node_modules already holds 5.4.21, so an
  unpinned install pulls a major and ERESOLVEs, and the scripts
  `dev` (vite), `build` (tsc --noEmit && vite build), `preview` (vite preview).

  vitest must be able to run DOM tests. Use the per-file pragma
  `// @vitest-environment happy-dom` at the top of any test needing a document --
  vitest.config.ts is in no card's scope, so environmentMatchGlobs is not
  reachable from here. tsconfig already has the DOM lib; you do not need to add it.

  mount() renders the scene line and nothing else this card. P102 makes it a
  renderer. Keep it that small — .llm/rules/no-dead-scaffolding.mdc.
notes: |
  No UI framework (P1.md). The shell imports from src/core/api only.
  package.json is a shared path; touch only the lines this card names.
