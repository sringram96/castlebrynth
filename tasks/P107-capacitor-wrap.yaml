id: P107
card: P107
phase: P1
title: Capacitor wrap
lane: factory
deps: [P103, P104, P105]
scope:
  - capacitor.config.ts
  - package.json
  - .gitignore
acceptance: tests/acceptance/P107.capacitor.test.ts
done_when: npx vitest run tests/acceptance/P107.capacitor.test.ts
goal: |
  Wrap the built shell for a phone.

  Add @capacitor/core, @capacitor/cli and @capacitor/android. capacitor.config.ts
  names the app (appId com.castlebrynth.app, appName "Castle Brynth",
  webDir "dist").

  Add npm scripts: `cap:sync` (npm run build && cap sync android) and
  `cap:open` (cap open android).

  Generate the android/ project with `npx cap add android`, and gitignore its
  build output (android/app/build, android/.gradle, android/local.properties)
  while committing the project itself.

  DONE means: `npm run build` produces dist/, and `npx cap sync android`
  completes clean. Installing on a device is the human's job and is the P1
  exit gate, not this card's.
notes: |
  ANDROID_HOME is not set on this machine; the SDK is at ~/Android/Sdk and
  java is 21. `cap sync` does not need the SDK — only `cap open` and a gradle
  build do. Do not attempt a gradle build in the acceptance; it is minutes
  long and needs a network it may not have.

  If `cap add android` cannot run for any reason, STOP and report it. Do not
  hand-write the android project.
