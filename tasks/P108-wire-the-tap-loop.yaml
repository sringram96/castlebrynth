id: P108
card: P108
phase: P1
title: Wire the tap loop
lane: factory
deps: [P101, P102, P103, P104]
scope:
  - src/shell/mount.ts
  - src/shell/mount.test.ts
  - src/shell/boot.ts
  - src/shell/boot.test.ts
  - index.html
acceptance: tests/acceptance/P100.slice.test.ts
done_when: npx vitest run tests/acceptance/P100.slice.test.ts
goal: |
  P1 built every piece of the shell and never connected them. render() draws a
  View, renderPanel() draws the journal, persist saves and restores — and
  mount() calls none of them past the first frame. Nothing is clickable. This
  card is the wiring, and it is the last thing between P1 and its exit gate.

  **mount(root, game, storage?)**
    - draw the current View with render() and the current state with
      renderPanel(), into root
    - on a tap, call game.act(state, ref), keep the returned state, and redraw
      BOTH the scene and the panel from it
    - show the effects of that act: the `say` text, and a `refused` line marked
      as a refusal. The acceptance greps for the refusal prose, so it must reach
      the screen.
    - when a storage is passed, save(storage, state) after every act. Keep the
      third parameter optional -- P101's acceptance asserts mount.length >= 2 and
      P100 mounts with two arguments.
    - mount keeps the run in a closure. It is the ONLY place shell state lives;
      render and panel stay pure draws.

  **src/shell/boot.ts** — the browser entry, and the reason the built page is
  currently blank. index.html points its module tag here. It must:
    - load content/bundle.json (import it so Vite bundles it into dist -- a
      Capacitor app has no server to fetch it from)
    - loadBundle, createGame, restore() from localStorage, mount into #app
    - be INERT when there is no #app: `document.getElementById('app')` is null
      under happy-dom, and boot must not throw or act during the test suite.
      This is why the boot is not in mount.ts -- a module-level side effect
      there would fire inside every acceptance file that imports mount.

  This is the only place in the shell allowed to name `localStorage`.
notes: |
  Why this card exists, so you do not repeat it: mount.test.ts was in P101's
  scope alone while mount.ts was in P102/P103/P104's, so every card that needed
  to wire the loop was forbidden from relaxing the unit test that forbade it
  (`expect(el.textContent).toBe(...)` fails the moment a control is drawn).
  That assertion has been relaxed to `toContain` on main. You own both files
  now, so the trap is gone.

  P1.md's frozen rule still holds and P100 checks it by reading your source:
  the shell touches GameAPI only. No import of core/resolve, no reading
  bundle.scenes. boot.ts is not in P100's module list but obey it anyway.

  Do not touch tests/acceptance/ (AGENTS.md law 3). P100.slice.test.ts is your
  definition of done and it was adversarially audited before dispatch.
