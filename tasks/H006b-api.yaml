goal: |
  src/core/api.ts over resolve.

    newRun(seed: number, bundle: Bundle): GameState
    createGame(bundle: Bundle): {
      newRun(seed): GameState
      act(state, ref, input?): { state, effects }
      getView(state): View
    }

  act and getView never mutate. An unknown object or action is a no-op that
  returns the state unchanged — not a throw. Determinism replay holds: same
  seed, same taps, same state, byte for byte.
notes: |
  createGame exists because act(state, ref) in P0.md has no bundle parameter
  and GameState may not carry the bundle (RULES.md 2 — saves stay small).
  Binding the bundle at construction is the only way to honour both. The
  standalone newRun(seed, bundle) keeps P0.md's literal signature available.
