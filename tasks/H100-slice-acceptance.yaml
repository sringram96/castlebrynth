id: H100
title: P1 slice acceptance - the shell, end to end
goal: >
  VERIFY ONLY. Write no feature code. One scripted pass through the
  built shell: boot, read a room, tap an object and see it describe
  without advancing, take the action that refuses, learn the thing, take
  it again and watch it open, reach the dark crossing, see the end card.
  Run it first; if green, report already satisfied and change nothing.
context: [GAME.md, LAWS.md, AGENTS.md]
deps: [H104, H105, H108, H111, H114]
scope:
  - tests/acceptance/H100.slice.test.ts
non_goals:
  - "No fixes. A red assertion is a finding, reported, not patched."
allows_deps: []
acceptance:
  spec: >
    Through the shell only: the first frame draws the waking place with
    its objects tappable; a bare object tap changes no state; the gated
    action refuses and is ledgered; the teaching action sets its flag;
    the same tap then succeeds; the end card is absent before the dark
    crossing and present after. No flag, seed or reserved engine key ever
    appears on screen.
  commands:
    - npx vitest run tests/acceptance/H100.slice.test.ts
