done_when: law green; jsdom test — the mounted app advances state exactly as core act does for the same seed
goal: |
  src/shell/app.ts — the composition, and the only place the run lives.

    mount(el, bundle, saved?) -> { getState, dispatch, dispose }

  Composes narrator + scene + panel + input over GameAPI, re-renders after
  every act, and leaves an autosave hook point after each one for H109 to
  fill. The shell touches newRun / act / getView and nothing else: no import
  of resolve.ts, and nothing here reads bundle.scenes to decide what to draw.

  main.ts is rewired from H101's placeholder to this mount.
notes: |
  The proof that matters: drive the mounted app and drive core act directly
  with the same seed and the same taps, and the two states are equal.
