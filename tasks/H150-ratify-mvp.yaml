goal: |
  The human's ruling, committed. GAME.md v4.1, MVP.md, and the playable
  mock/slice-mvp.html — which IS the specification. Ship parity with it
  through the factory, nothing more.

  Rulings encoded:
    NO XP / no levels. Improvements are items and grants (GAME.md
      #improvements).
    Death = wipe-except-kept: wake at the Crossing, bars and skill uses
      restored; the pack is taken except key items (✦), items marked kept
      (the rusted knife), and one random survivor; consumables and tithes
      lost; flags, skills and grants persist (#death).
    The corridor slot swaps variant on each wake — simple maze mode (#maze).
    Deferred behind H199: Effigy/tithe-drop, the Communion, the generator,
      glimpses, economy, counters, lies/Fraying content, complicity, XP.

  This trims H200: state v2 keeps stats, tithes, slots and the kept flag,
  and EXCLUDES xp and level fields.
