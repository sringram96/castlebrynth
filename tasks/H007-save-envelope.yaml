id: H007
title: Save envelope v1
goal: >
  src/core/save.ts - serialize(state) to a {v:1, state} envelope and
  parse(raw) returning GameState or null. Pure string-in string-out;
  platform storage arrives in P1.
context: [RULES.md, skill:engine]
deps: [H001]
scope:
  - src/core/save.ts
  - src/core/save.test.ts
  - tests/acceptance/H007.save.test.ts
non_goals: ["No device storage, no migrations beyond the v1 envelope."]
allows_deps: []
acceptance:
  spec: >
    Round-trip is deep-equal for a populated GameState; parse returns
    null (never throws) on malformed JSON, wrong version, and missing
    fields.
  commands:
    - npx vitest run tests/acceptance/H007.save.test.ts
