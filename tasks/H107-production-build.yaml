id: H107
title: Production build - dist the wrapper can carry
goal: >
  npm run build produces a self-contained dist/ - the web assets a
  Capacitor wrap copies (H112) and the artifact the playtester serves.
  The compiled content bundle is inlined rather than fetched, because a
  packaged app has no server to fetch it from.
context: [RULES.md, AGENTS.md]
deps: [H101]
scope:
  - package.json
  - vite.config.ts
  - tests/acceptance/H107.build.test.ts
non_goals:
  - "No native platforms - H112 owns Capacitor."
  - "No CI changes; the law job stays web-only."
allows_deps: []
acceptance:
  spec: >
    npm run build exits zero and writes dist/index.html plus hashed
    assets; the built bundle contains the compiled content rather than
    requesting it at runtime; opening dist over file:// or a static
    server renders the first scene. Build output is gitignored.
  commands:
    - npx vitest run tests/acceptance/H107.build.test.ts
