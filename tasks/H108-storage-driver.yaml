goal: |
  src/platform/storage.ts — Capacitor Preferences with a localStorage
  fallback and an in-memory fallback under that, so the suite runs headless.

    saveRun(state): Promise<void>
    loadRun(bundle): Promise<GameState | null>
    clearRun(): Promise<void>

  Wraps H007's envelope rather than inventing a second one. Types come from
  src/core only (RULES.md layering) — this file may not import resolve.ts.

  A corrupt save is not a crash and not a half-run: loadRun returns null and
  the caller starts fresh, quietly.
