id: H005
card: H005
title: Content lint v0
lane: factory
deps: [H003b]
scope:
  - scripts/content-lint.mjs
  - package.json
acceptance: tests/acceptance/H005.lint.test.ts
done_when: npx vitest run tests/acceptance/H005.lint.test.ts
goal: |
  scripts/content-lint.mjs <paths...> — the compiler proves the words are
  legal; this proves the scene is playable. Checks:

    1. gate satisfiability — every flag a gate needs is set by some response
       somewhere; every item a gate needs is granted by some addItem
    2. mandatory fallback — every response list ends gateless
    3. goto targets — every goto names a scene that exists
    4. refuse purity — a response with `refuse` carries no other delta
    5. CANON banned words — whole-word, case-insensitive, over say / refuse /
       journal / line / enter

  Report every failure, not just the first, each naming file and path. Exit
  non-zero if any.

  Then wire it in: append `&& npm run content-lint` to the `law` script and
  add the `content-lint` script itself.
notes: |
  Whole-word matching matters — "invention" must not trip on a banned word.
  package.json is in scope ONLY for those two script lines.
