id: H005
title: Content lint v0
goal: >
  scripts/content-lint.mjs - the law walk over compiled content: every
  gate's flags are settable and items obtainable somewhere (gate
  satisfiability), every action ends in a gateless fallback, goto
  targets exist, refuse responses carry no other delta, and canon
  banned words are absent. Wire it into npm run law.
context: [LAWS.md, VOCAB.md, CANON.md, skill:engine]
deps: [H003]
scope:
  - scripts/content-lint.mjs
  - tests/acceptance/H005.lint.test.ts
  - package.json
non_goals: ["No spoiler-tier or telegraph checks yet - those need more
  content than P0 has and arrive with P2/P3 cards."]
allows_deps: []
acceptance:
  spec: >
    Lint passes on the repo's content; seeded bad fixtures (unreachable
    gate flag, missing fallback, dangling goto, refuse with a set)
    each fail with a message naming the card path; npm run law invokes
    it.
  commands:
    - npx vitest run tests/acceptance/H005.lint.test.ts
