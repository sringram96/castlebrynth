id: H004a
card: H004
half: A
title: Content builder (YAML to bundle)
lane: factory
deps: [H003b]
scope:
  - scripts/build-content.mjs
acceptance: tests/acceptance/H004.compiler.test.ts
done_when: npx vitest run tests/acceptance/H004.compiler.test.ts -t H004a
goal: |
  scripts/build-content.mjs compiles content/*.yaml -> content/bundle.json.

    node scripts/build-content.mjs
    node scripts/build-content.mjs --only <path>    # compile one file

  Validate through parseScene (H003a) so the compiler and the engine can
  never disagree about the vocabulary. An unknown word fails the build with
  a message naming the file AND the path inside it (RULES.md 3):

    tests/fixtures/bad-vocab.yaml: objects.book.read[0].setFlagg - unknown vocabulary word

  Exit non-zero on failure. Output must be byte-stable: sort keys, fixed
  indent, trailing newline. Building twice produces an identical file.
notes: |
  `start` is the id of the scene named `shore`. v is 1.
