done_when: law green; helpers unit-tested (pure, idempotent)
goal: |
  src/shell/theme.ts — wireframe design tokens (colours, spacing, type) that
  the human re-skins in H115 without touching a single layout decision.

  src/shell/viewmap.ts — pure helpers mapping View to render structs. Zero
  game rules: no gate is evaluated here, no action is decided here, nothing
  is remembered between calls. getView already said what is true; this only
  says how it is shaped for a screen.
notes: |
  Idempotent means f(f(x)) draws the same as f(x). The tests should say so.
