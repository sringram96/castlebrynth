id: P106
card: P106
phase: P1
title: Scripts consume the engine
lane: factory
deps: [P101, H004a, H005, H008]
scope:
  - scripts/build-content.mjs
  - scripts/content-lint.mjs
  - scripts/play.mjs
  - scripts/build-content.ts
  - scripts/content-lint.ts
  - scripts/play.ts
  - package.json
  - package-lock.json
acceptance: tests/acceptance/P106.scripts.test.ts
done_when: npx vitest run tests/acceptance/P106.scripts.test.ts tests/acceptance/H004.compiler.test.ts tests/acceptance/H005.lint.test.ts tests/acceptance/H008.play.test.ts && npm run law
goal: |
  Pay P0's debt. Delete both hand-copied engines.

  scripts/build-content.mjs holds a second copy of parseScene's vocabulary
  gate. scripts/play.mjs holds a second copy of resolve. Both headers say
  they should be deleted the moment an import is reachable. It is now.

  Convert the three scripts from .mjs to .ts (git mv, so the history
  survives), delete the copied blocks, and import the real thing:
    build-content.ts  -> parseScene from src/core/cards
    content-lint.ts   -> parseScene from src/core/cards
    play.ts           -> loadBundle from src/core/bundle, createGame from src/core/api

  Add `tsx` as a devDependency and repoint the package.json scripts
  (build:content, content-lint, play) at `tsx scripts/<name>.ts`.

  Behaviour must not change: H004, H005 and H008's acceptance tests all spawn
  these scripts and all must stay green.

  One real bug gets fixed by construction: play.mjs emits only [refused] on a
  refusing branch, where resolve.ts emits [say, refused]. Importing the engine
  ends the divergence.
notes: |
  Leave scripts/board.mjs, progress.mjs, task-lint.mjs and cards.mjs alone —
  they are factory tooling and import nothing from src/core.

  The acceptance greps the scripts for the copied blocks. Deleting the code is
  the card; do not leave it commented out.

dep_note: |
  Depends on the three cards whose scripts it rewrites. That is a real
  ordering constraint, not a lint formality: P106 deletes code H004a, H005 and
  H008 wrote, and their acceptance tests must stay green across the change.
