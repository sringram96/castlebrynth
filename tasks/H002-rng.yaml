title: Seeded RNG (state as data)
lane: factory
deps: [H001a]
scope:
  - src/core/rng.ts
  - src/core/rng.test.ts
acceptance: tests/acceptance/H002.rng.test.ts
done_when: npx vitest run tests/acceptance/H002.rng.test.ts
goal: |
  mulberry32 over uint32. There is no generator object — an Rng is a number
  you thread through (.llm/rules/purity.mdc).

    seedRng(seed: number): Rng
    nextInt(rng: Rng, n: number): [k: number, rng2: Rng]   // k in [0, n)

  The acceptance holds a frozen five-draw golden for seed 42. Do not
  "improve" the algorithm to make it prettier — that golden is a promise to
  every save file that will ever exist.
notes: |
  Use Math.imul for the 32-bit multiplies. `>>> 0` to stay unsigned.
